async function resumeEntry(e){
  if (!e) return;
  plan = null;
  const cur = queue[qi];
  // та же серия уже загружена и стоит на паузе — просто вернуться к ней
  if (cur && cur.id === e.file && v.getAttribute('src')) { showPlayer(); v.play().catch(()=>{}); return; }
  // пара секунд до места остановки — чтобы вспомнить, на чём прервались
  const seek = it => { resumeFor = e.position > 0 ? {id: it.id, to: Math.max(0, e.position - 5)} : null; };
  if (e.kind === 'film') {
    const r = await getJSON('/api/item?id='+encodeURIComponent(e.file)).catch(() => ({}));
    if (!r.item) { $('path').textContent = 'Фильм не найден — возможно, его удалили'; return; }
    if (!playable(r.item)) return transcode(r.item);
    seek(r.item);
    queue = [r.item]; qi = 0;
    playVideo();
    showPlayer();
    return;
  }
  const r = await getJSON('/api/browse?id='+encodeURIComponent(e.season_id)).catch(() => ({items:[]}));
  const list = (r.items||[]).filter(x => !x.is_dir);
  const it = list.find(x => x.id === e.file);
  if (!it) { $('path').textContent = 'Серия не найдена — возможно, её удалили'; return; }
  if (!playable(it)) return transcode(it);
  seek(it);
  startSeason(list, list.indexOf(it));
}

// Позиция уходит агенту раз в 15 секунд, на паузе, при выходе из плеера и в
// конце серии. Что считать досмотренным и какая серия следующая, решает агент.
let lastSaved = 0;
function saveProgress(final){
  const it = queue[qi];
  if (!it || !isFinite(v.duration) || v.duration <= 0) return Promise.resolve();
  if (forgotten === it.id) return Promise.resolve();
  // серию ещё не перемотали на сохранённое место — нельзя затереть его нулём
  if (resumeFor && resumeFor.id === it.id) return Promise.resolve();
  lastSaved = Date.now();
  return fetch(BASE+'/api/progress', {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({file: it.id, position: final ? v.duration : v.currentTime, duration: v.duration})})
    .catch(() => {});
}

// Страницу закрыли или приставку выключили: fetch может не успеть, а
// sendBeacon браузер доставит и после ухода со страницы.
function beaconProgress(){
  const it = queue[qi];
  if (!it || !isFinite(v.duration) || v.duration <= 0 || !navigator.sendBeacon) return;
  // на паузе позиция уже сохранена — повторять незачем
  if (v.paused || forgotten === it.id || (resumeFor && resumeFor.id === it.id)) return;
  navigator.sendBeacon(BASE+'/api/progress', new Blob([JSON.stringify(
    {file: it.id, position: v.currentTime, duration: v.duration})], {type: 'application/json'}));
}

v.addEventListener('loadedmetadata', () => {
  const it = queue[qi];
  if (resumeFor && it && resumeFor.id === it.id) {
    v.currentTime = Math.min(resumeFor.to, Math.max(0, (v.duration || 0) - 10));
    resumeFor = null;
  }
});
v.addEventListener('timeupdate', () => { if (!v.paused && Date.now() - lastSaved > 15000) saveProgress(false); });
v.addEventListener('pause', () => { if (!v.ended) saveProgress(false); });
// снова запустили убранное — значит, смотрят, и место опять нужно помнить
v.addEventListener('play', () => { const it = queue[qi]; if (it && forgotten === it.id) forgotten = null; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') beaconProgress(); });
window.addEventListener('pagehide', beaconProgress);

// --- очередь с главной ---

async function watchQueue(i){
  if (!watchList.length) return;
  plan = {i};
  const entry = watchList[i];
  if (!entry) { plan = null; return; }
  const ok = entry.kind === 'film' ? await playFilm(entry) : await playSeriesFrom(entry, 0, 0);
  // запись не заиграла (удалили файл, не тот формат) — к следующей
  if (!ok && plan && plan.i === i) return watchQueue(i+1);
}

// Видеоочередь кончилась. Сначала — следующий сезон того же сериала (это
// работает и в режиме «Файлы»: включили серию из папки сезона — после неё
// пойдут серии следующего). Потом — следующая запись очереди с главной.
let continuing = false;
async function onQueueEnd(){
  if (continuing) return;
  continuing = true;
  try {
    const last = queue[queue.length-1];
    if (last) {
      const r = await getJSON('/api/next-season?id='+encodeURIComponent(last.id)).catch(() => ({items:[]}));
      const vids = (r.items||[]).filter(x => !x.is_dir && x.url && playable(x) && hasVideo(x));
      if (vids.length) {
        queue = queue.concat(vids);
        qi++;
        playVideo();
        return true;
      }
    }
    if (plan && plan.i + 1 < watchList.length) { await watchQueue(plan.i + 1); return true; }
    if (plan) plan = null;
    return false;
  } finally {
    continuing = false;
  }
}

// --- плеер в визуальном режиме ---

function showPlayer(){
  if (!musicQueue.length) toggleMusicPick(true);
  setTimeout(() => updateBackdrop(), 0);
  if (mode !== 'visual') return;
  $('app').classList.add('player');
  $('path').textContent = queue[qi] ? queue[qi].name : 'Плеер';
  $('up').style.visibility = 'visible';
  $('bar').firstElementChild.focus();
}

// Назад из плеера — видео на паузу: смотреть каталог под звук серии никто не
// хочет. Место сохраняется, на главной появится «Продолжить».
async function leavePlayer(){
  hideSkip();
  $('app').classList.remove('player', 'theater');
  if (!v.paused) v.pause();
  await saveProgress(false);
  await loadProgress();
  renderVisual();
}

// --- пространственная навигация стрелками ---
//
// В каталоге плитки стоят сеткой, и «вниз» должно вести на плитку под
// текущей, а не на следующую по порядку в DOM. Ищем ближайший элемент в
// нужную сторону по координатам.

function focusables(){
  const scope = !$('qlist').hidden ? [$('qlist')] : !$('amodal').hidden ? [$('amodal')] : !$('admin').hidden ? [$('admin')]
    : $('app').classList.contains('player') && mode === 'visual'
    ? [$('head'), $('right')] : mode === 'visual' ? [$('head'), $('visual'), $('vmusic')] : [$('head'), $('left'), $('right')];
  const out = [];
  scope.forEach(root => root.querySelectorAll('button,a[href],input,[tabindex="0"]').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width && r.height && el.offsetParent !== null && getComputedStyle(el).visibility !== 'hidden') out.push(el);
  }));
  return out;
}

function focusFirst(root){
  const el = root.querySelector('.btn.primary,[tabindex="0"],button');
  if (el) el.focus({preventScroll:true});
}

function spatialMove(dir){
  const cur = document.activeElement;
  const all = focusables();
  if (!cur || !all.includes(cur)) { if (all[0]) all[0].focus(); return; }
  const c = cur.getBoundingClientRect();
  const cx = c.left + c.width/2, cy = c.top + c.height/2;
  let best = null, bestScore = Infinity;
  for (const el of all) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect();
    const x = r.left + r.width/2, y = r.top + r.height/2;
    const dx = x - cx, dy = y - cy;
    let main, cross;
    if (dir === 'ArrowRight') { if (dx <= 4) continue; main = dx; cross = Math.abs(dy); }
    else if (dir === 'ArrowLeft') { if (dx >= -4) continue; main = -dx; cross = Math.abs(dy); }
    else if (dir === 'ArrowDown') { if (dy <= 4) continue; main = dy; cross = Math.abs(dx); }
    else { if (dy >= -4) continue; main = -dy; cross = Math.abs(dx); }
    // по своей линии дешевле, чем наискосок: иначе «вниз» уезжает в сторону
    const score = main + cross * 2.5;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) {
    best.focus({preventScroll:true});
    best.scrollIntoView({block:'nearest', inline:'nearest'});
  }
}

document.addEventListener('keydown', e => {
  if (!$('app').classList.contains('on')) return;
  // Окно ввода: буквы, «Backspace» и стрелки влево-вправо принадлежат полю,
  // Enter — «Сохранить», Escape — «Отмена», вверх-вниз — к кнопкам окна.
  const typing = e.target && e.target.tagName === 'INPUT';
  if (typing) {
    if (e.key === 'Enter') { e.preventDefault(); modalAnswer(true); }
    else if (e.key === 'Escape') { e.preventDefault(); modalAnswer(false); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); spatialMove(e.key); }
    return;
  }
  if (!$('qlist').hidden) {
    if (e.key.startsWith('Arrow')) { e.preventDefault(); spatialMove(e.key); }
    else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); toggleQueue(false); }
    else if (e.key === ' ') { e.preventDefault(); musicActions.playpause(); renderQueue(); }
    return;
  }
  if (castOpen()) {
    e.preventDefault();
    if (e.key === 'Escape' || e.key === 'Backspace') closeCast();
    else if ((e.key === 'Enter' || e.key === 'MediaPlayPause') && !e.repeat) castActions.playpause();
    else if (e.key === 'ArrowLeft') castActions.back();
    else if (e.key === 'ArrowRight') castActions.fwd();
    return;
  }
  if (!$('amodal').hidden) {
    if (e.key.startsWith('Arrow')) { e.preventDefault(); spatialMove(e.key); }
    else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); modalAnswer(false); }
    return;
  }
  if (!$('admin').hidden) {
    if (e.key.startsWith('Arrow')) { e.preventDefault(); spatialMove(e.key); }
    else if (e.key === 'Escape' || e.key === 'Backspace') {
      e.preventDefault();
      if (e.key === 'Backspace' && adminState.screen === 'pin' && adminState.pinInput) { pinKey('del'); return; }
      adminBack();
    }
    else if (adminState.screen === 'pin' && /^[0-9]$/.test(e.key)) { e.preventDefault(); pinKey(e.key); }
    else if (e.key === 'Enter' && document.activeElement && document.activeElement.matches('[tabindex="0"]')) {
      e.preventDefault(); document.activeElement.click();
    }
    return;
  }
  if (photoFull) {
    const top = vstack[vstack.length-1];
    const cur = top && top.photos[top.index];
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); photoStep(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); photoStep(-1); }
    else if (e.key === 'Enter' || e.key === 'MediaPlayPause') {
      // OK: у ролика — пауза, в слайд-шоу — пауза показа, у снимка — назад к полосе
      e.preventDefault();
      if (e.repeat) return;
      if (cur && cur.video) { const vid = $('pfvid'); if (vid.paused) vid.play().catch(()=>{}); else vid.pause(); }
      else if (slideshow) toggleSlideshowPause();
      else closePhotoFull();
    }
    else if (e.key === 'Backspace' || e.key === 'Escape') { e.preventDefault(); closePhotoFull(); }
    return;
  }
  // Во весь экран кнопок не видно, а фокус остаётся на скрытой кнопке панели
  // (обычно «⛶ Во весь экран»): OK нажимал её и сворачивал видео. Здесь OK —
  // пауза и старт, как у любого плеера; зажатый OK не должен мигать паузой.
  // появилась «Пропустить заставку» или «Следующая серия»: OK жмёт её, «Назад» — отказ
  if (skipKind && (e.key === 'Enter' || e.key === 'Escape' || e.key === 'Backspace') &&
      ($('app').classList.contains('theater') || document.activeElement === $('skipbtn') || e.key !== 'Enter')) {
    e.preventDefault();
    if (!e.repeat) { if (e.key === 'Enter') doSkip(); else cancelSkip(); }
    return;
  }
  if ($('app').classList.contains('theater') && (e.key === 'Enter' || e.key === 'MediaPlayPause')) {
    e.preventDefault();
    if (!e.repeat) { actions.playpause(); osd(v.paused ? '⏸' : '▶'); }
    return;
  }
  // Во весь экран стрелки влево-вправо — перемотка на 30 с (зажатая стрелка
  // мотает дальше), вверх-вниз — ±5 минут или громкость (выбирается в
  // админке, «Оформление»).
  if ($('app').classList.contains('theater') && e.key.startsWith('Arrow')) {
    e.preventDefault();
    if (e.key === 'ArrowLeft') { actions.back(); osd('⏪ '+posText()); }
    if (e.key === 'ArrowRight') { actions.fwd(); osd('⏩ '+posText()); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const up = e.key === 'ArrowUp';
      if (looksCfg.arrows === 'volume') {
        v.volume = Math.min(1, Math.max(0, Math.round((v.volume + (up ? 0.1 : -0.1)) * 10) / 10));
        osd('🔊 '+Math.round(v.volume * 100)+'%');
      } else {
        v.currentTime = Math.min(Math.max(0, (v.duration || 1e9) - 5), Math.max(0, v.currentTime + (up ? 300 : -300)));
        osd((up ? '⏩ +5 мин  ' : '⏪ −5 мин  ')+posText());
      }
    }
    return;
  }
  if (e.key.startsWith('Arrow')) { e.preventDefault(); spatialMove(e.key); return; }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.matches('[tabindex="0"]')) {
    e.preventDefault(); document.activeElement.click(); return;
  }
  if (e.key === 'Backspace' || e.key === 'Escape') {
    if ($('app').classList.contains('theater')) { e.preventDefault(); actions.full(); return; }
    e.preventDefault(); goBack(); return;
  }
  if (e.key === ' ') { e.preventDefault(); actions.playpause(); }
});

// --- фон ---
//
// Общий фон — из админки (картинка, размытие, затемнение). На экране сериала
// и папки роликов вместо него — их постер, сильно размытый: экран сразу
// «про этот сериал». В плеере и в «Файлах» фона нет — там он только мешает.

let looksCfg = {background: '', bg_blur: 6, bg_dim: 40, arrows: 'seek'};
async function loadLooks(){
  try { Object.assign(looksCfg, await getJSON('/api/settings')); } catch(e) {}
  backdropKey = '';
  updateBackdrop();
}

let backdropKey = '';
function updateBackdrop(top){
  top = top === undefined ? vstack[vstack.length-1] : top;
  const app = $('app');
  let url = looksCfg.background, blur = looksCfg.bg_blur, dim = looksCfg.bg_dim;
  if (top && (top.kind === 'series' || top.kind === 'clips' || top.kind === 'info') && top.tile && top.tile.poster) {
    url = top.tile.poster; blur = 28; dim = 62;
  }
  if (mode !== 'visual' || !app.classList.contains('on') || app.classList.contains('player') ||
      app.classList.contains('theater')) url = '';
  const key = url + '|' + blur + '|' + dim;
  if (key === backdropKey) return;
  backdropKey = key;
  if (!url) { $('bg').classList.remove('on'); $('bgdim').style.opacity = 0; return; }
  const pre = new Image();
  pre.onload = () => {
    if (backdropKey !== key) return;
    $('bg').style.backgroundImage = 'url("'+url.replace(/"/g, '%22')+'")';
    $('bg').style.filter = blur > 0 ? 'blur('+blur+'px)' : '';
    $('bgdim').style.opacity = dim / 100;
    $('bg').classList.add('on');
  };
  // постера нет — остаётся общий фон
  pre.onerror = () => {
    if (backdropKey !== key || url === looksCfg.background) return;
    backdropKey = ''; updateBackdrop(null);
  };
  pre.src = url;
}

// --- заставка и титры ---
//
// Отмечают в одной серии («✂ Заставка и титры» под видео) — работает на весь
// сериал: отметки хранит агент. Во время заставки — «⏭ Пропустить заставку»
// (или пропуск сам, если так настроено), на титрах — «Следующая серия через
// 10 с». Во весь экран OK жмёт эту кнопку, «Назад» — отказывается.

const SKIP_WINDOW = 60;         // сколько секунд предлагаем пропустить заставку
let curMarks = null, marksFor = null;
let skipKind = null, skipTimer = null;
let introDoneFor = null, creditsDoneFor = null;

async function loadMarks(it){
  marksFor = it.id; curMarks = null;
  hideSkip();
  try {
    const r = await getJSON('/api/marks?file='+encodeURIComponent(it.id));
    if (marksFor === it.id && r.marks) curMarks = r;
  } catch(e) {}
  renderMarkPanel();
  renderSkipToggle();
}

// «Пропуск» рядом с «Во весь экран»: выключатель на весь сериал. Отметки
// остаются на месте, просто кнопку «⏭ Пропустить» и отсчёт следующей серии
// больше не показываем — иногда заставку хочется смотреть.
function renderSkipToggle(){
  const b = $('skiptoggle');
  const m = curMarks && curMarks.marks;
  b.hidden = !m || (!m.intro_end && !m.credits_from_end);
  if (b.hidden) return;
  b.textContent = m.skip_off ? '⏭ Пропуск: выкл' : '⏭ Пропуск: вкл';
  b.classList.toggle('on', !m.skip_off);
}

async function toggleSkip(){
  const it = queue[qi];
  if (!it || !curMarks) return;
  const off = !curMarks.marks.skip_off;
  const r = await fetch(BASE+'/api/marks', {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({file: it.id, scope: 'series', skip_off: off})}).then(r => r.json()).catch(() => null);
  if (!r || !r.marks) return osd('Не вышло сохранить');
  curMarks = r;
  if (off) hideSkip();
  renderSkipToggle();
  renderMarkPanel();
  osd(off ? '⏭ Пропуск выключен для этого сериала' : '⏭ Пропуск включён');
}

function hasNextEpisode(){
  return qi + 1 < queue.length || (curMarks && curMarks.kind === 'series') || (plan && plan.i + 1 < watchList.length);
}

v.addEventListener('timeupdate', () => {
  const it = queue[qi];
  if (!it || !curMarks || marksFor !== it.id || v.paused) return;
  const m = curMarks.marks, t = v.currentTime, d = v.duration;
  if (m.skip_off) return;                 // выключено для этого сериала
  // Кнопку показываем не всю заставку, а первую минуту: у размеченного «с
  // самого начала» сериала заставка тянется до конца пролога, и кнопка висела
  // бы над видео минутами, а зритель, вернувшийся к середине пролога, мог бы
  // случайно перескочить десять минут серии.
  const introTo = Math.min(m.intro_end - 1, m.intro_start + SKIP_WINDOW);
  if (m.intro_end > 0 && t >= m.intro_start && t < introTo && introDoneFor !== it.id) {
    if (m.auto_skip) { introDoneFor = it.id; v.currentTime = m.intro_end; osd('⏭ Заставка пропущена', true); }
    else showSkip('intro');
  } else if (skipKind === 'intro') hideSkip();
  const credits = m.credits_from_end > 0 && isFinite(d) && d > m.credits_from_end + 60 ? d - m.credits_from_end : 0;
  // после титров бывает сцена: тогда пропуск ведёт к ней, а не к следующей серии
  const afterCredits = m.credits_end_from_end > 0 && m.credits_end_from_end < m.credits_from_end ? d - m.credits_end_from_end : 0;
  if (credits && t >= credits && creditsDoneFor !== it.id && (afterCredits ? t < afterCredits - 1 : hasNextEpisode())) {
    if (afterCredits) showSkip('after-credits');
    else if (skipKind !== 'credits') startCountdown();
  } else if ((skipKind === 'credits' || skipKind === 'after-credits') && credits &&
             (t < credits || (afterCredits && t >= afterCredits - 1))) hideSkip();   // перемотали или сцена началась
});

function showSkip(kind){
  if (skipKind === kind) return;
  hideSkip();
  skipKind = kind;
  $('skipbtn').textContent = kind === 'after-credits' ? '⏭ Пропустить титры' : '⏭ Пропустить заставку';
  $('skipno').hidden = true;
  $('skipbox').hidden = false;
  if (!$('app').classList.contains('theater')) $('skipbtn').focus();
}

function startCountdown(){
  hideSkip();
  skipKind = 'credits';
  let n = 10;
  const label = () => { $('skipbtn').textContent = '▶ Следующая серия через '+n+' с'; };
  label();
  $('skipno').hidden = false;
  $('skipbox').hidden = false;
  if (!$('app').classList.contains('theater')) $('skipbtn').focus();
  skipTimer = setInterval(() => {
    if (v.paused) return;          // поставили на паузу — отсчёт ждёт
    if (--n <= 0) return doSkip();
    label();
  }, 1000);
}

function hideSkip(){
  clearInterval(skipTimer);
  skipTimer = null;
  skipKind = null;
  $('skipbox').hidden = true;
}

// Титры — «досмотрено»: агент переводит «Продолжить» на следующую серию, и
// только потом включается она сама (иначе позиция на титрах записалась бы
// как недосмотренная).
function doSkip(){
  const it = queue[qi];
  if (!it) return hideSkip();
  if (skipKind === 'intro') {
    introDoneFor = it.id;
    v.currentTime = curMarks.marks.intro_end;
    hideSkip();
    return osd('⏭ Заставка пропущена', true);
  }
  // после титров есть сцена — прыгаем к ней, а не к следующей серии
  if (skipKind === 'after-credits') {
    creditsDoneFor = it.id;
    v.currentTime = Math.max(0, (v.duration || 0) - curMarks.marks.credits_end_from_end);
    hideSkip();
    return osd('⏭ Титры пропущены');
  }
  if (skipKind === 'credits') {
    creditsDoneFor = it.id;
    hideSkip();
    saveProgress(true).then(() => {
      if (qi + 1 < queue.length) { qi++; playVideo(); } else onQueueEnd();
    });
  }
}

function cancelSkip(){
  const it = queue[qi];
  if (it && skipKind === 'intro') introDoneFor = it.id;
  if (it && (skipKind === 'credits' || skipKind === 'after-credits')) creditsDoneFor = it.id;
  hideSkip();
}

$('skipbtn').onclick = doSkip;
$('skipno').onclick = cancelSkip;

// Уровень записи: тот же, что в админке. Сезон предлагаем только если он есть.
let mkScope = 'series';

function mkScopeName(scope){
  const d = curMarks || {};
  if (scope === 'season') return 'сезона «'+(d.season_name || '')+'»';
  if (scope === 'episode') return 'этой серии';
  return d.kind === 'series' ? 'всего сериала' : 'этого фильма';
}

function mkScopeNext(){
  const order = ['series'].concat(curMarks && curMarks.season_id ? ['season'] : []).concat(['episode']);
  mkScope = order[(order.indexOf(mkScope) + 1) % order.length];
}

function renderMarkPanel(){
  const box = $('markpanel');
  if (box.hidden) return;
  const it = queue[qi];
  if (!it) { box.innerHTML = '<span class="mrow">Ничего не играет</span>'; return; }
  const m = (curMarks && curMarks.marks) || {};
  if (mkScope === 'season' && !(curMarks && curMarks.season_id)) mkScope = 'series';
  box.innerHTML = '<span class="mrow">Заставка: '+(m.intro_end ? fmt(m.intro_start)+' – '+fmt(m.intro_end) : 'не отмечена')+
    ' · титры: '+(m.credits_from_end ? 'за '+fmt(m.credits_from_end)+' до конца'+
      (m.credits_end_from_end ? ', кончаются за '+fmt(m.credits_end_from_end) : ' и до конца серии') : 'не отмечены')+'</span>'+
    '<button class="btn" data-mk="start">⏵ Заставка начинается здесь</button>'+
    '<button class="btn" data-mk="end">⏹ Заставка кончается здесь</button>'+
    '<button class="btn" data-mk="credits">🎬 Титры начинаются здесь</button>'+
    '<button class="btn" data-mk="credits-end">⏹ Титры кончаются здесь</button>'+
    '<button class="btn" data-mk="credits-to-end">🏁 Титры до конца серии</button>'+
    '<button class="btn" data-mk="scope">✍ Записывать для '+mkScopeName(mkScope)+'</button>'+
    '<button class="btn'+(m.auto_skip ? ' on' : '')+'" data-mk="auto">'+(m.auto_skip ? '☑' : '☐')+' Пропускать заставку сам</button>'+
    '<button class="btn'+(m.skip_off ? '' : ' on')+'" data-mk="off">'+(m.skip_off ? '☐' : '☑')+' Предлагать пропуск</button>'+
    '<button class="btn" data-mk="reset">Сбросить у '+mkScopeName(mkScope)+'</button>';
}

$('markpanel').addEventListener('click', async e => {
  const b = e.target.closest('[data-mk]');
  const it = queue[qi];
  if (!b || !it) return;
  const t = v.currentTime || 0, d = v.duration || 0;
  const m = (curMarks && curMarks.marks) || {};
  if (b.dataset.mk === 'scope') {
    mkScopeNext();
    renderMarkPanel();
    const again = $('markpanel').querySelector('[data-mk="scope"]');
    if (again) again.focus();
    return;
  }
  const body = {file: it.id, scope: mkScope};
  switch (b.dataset.mk) {
    case 'start': body.intro_start = t; break;
    case 'end': body.intro_end = t; introDoneFor = it.id; break;     // отметили — в этой серии уже пропущено
    case 'credits':
      if (!d) return;
      body.credits_from_end = d - t;
      body.credits_end_from_end = 0;   // где кончаются — отдельная кнопка, старое значение не в счёт
      creditsDoneFor = it.id;
      break;
    case 'credits-end': if (!d) return; body.credits_end_from_end = d - t; break;
    case 'credits-to-end': body.credits_end_from_end = 0; break;
    case 'auto': body.auto_skip = !m.auto_skip; break;
    case 'off': body.scope = 'series'; body.skip_off = !m.skip_off; break;
    case 'reset': body.reset = true; break;
  }
  const r = await fetch(BASE+'/api/marks', {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)}).then(r => r.json()).catch(() => null);
  if (r && r.marks) curMarks = r;
  const key = b.dataset.mk;
  renderMarkPanel();
  renderSkipToggle();
  const again = $('markpanel').querySelector('[data-mk="'+key+'"]');
  if (again) again.focus();
});

// --- таймер сна ---
//
// «🌙 Сон» по кругу: выкл → 15 → 30 → 60 → 90 → 120 → 180 минут → после этой серии. Время
// вышло — звук за 15 секунд тихо уходит, видео и музыка встают на паузу, и
// «Музыка на паузе» при этом не включается.

const SLEEP_STEPS = [0, 15, 30, 60, 90, 120, 180, 'ep'];
let sleepMode = 0, sleepAt = 0, sleeping = false;

function renderSleep(){
  let text = '🌙 Сон: выкл';
  if (sleepMode === 'ep') text = '🌙 Сон: после серии';
  else if (sleepAt) text = '🌙 Сон: через '+Math.max(1, Math.ceil((sleepAt - Date.now()) / 60000))+' мин';
  $('sleepbtn').textContent = text;
  $('sleepbtn').classList.toggle('on', !!sleepMode);
}

function setSleep(step){
  sleepMode = step;
  sleepAt = typeof step === 'number' && step > 0 ? Date.now() + step * 60000 : 0;
  renderSleep();
}

function goToSleep(){
  setSleep(0);
  if (sleeping) return;
  sleeping = true;
  const v0 = v.volume, a0 = a.volume;
  let k = 30;
  const fade = setInterval(() => {
    k--;
    v.volume = v0 * k / 30;
    a.volume = a0 * k / 30;
    if (k > 0) return;
    clearInterval(fade);
    if (!v.paused) v.pause();
    if (!a.paused) a.pause();
    // громкость на место: утром включат — не должно быть тишины
    setTimeout(() => { v.volume = v0; a.volume = a0; sleeping = false; }, 300);
    osd('🌙 Спокойной ночи', true);
  }, 500);
}

setInterval(() => {
  if (sleepAt && Date.now() >= sleepAt) goToSleep();
  else if (sleepAt) renderSleep();
}, 5000);

// Короткая подсказка поверх видео во весь экран: панели там не видно, а
// понять, куда перемотали, надо.
let osdTimer = null;
const posText = () => fmt(v.currentTime) + (isFinite(v.duration) && v.duration > 0 ? ' / '+fmt(v.duration) : '');
function osd(text){
  const el = $('osd');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(osdTimer);
  osdTimer = setTimeout(() => el.classList.remove('on'), 1500);
}

// --- воспроизведение ---

function playVideo(){
  const it = queue[qi];
  if (!it) return;
  loadMarks(it);
  a.pause();                    // видео и музыка одновременно не звучат
  v.src = it.url;
  v.play().catch(e => {
    // переключение серии обрывает прошлый play() — это не ошибка, и затирать
    // ею название уже новой серии нельзя
    if (e.name === 'AbortError' || queue[qi] !== it) return;
    $('now').firstElementChild.textContent = 'Не запустилось: '+e.message;
  });
  $('now').firstElementChild.textContent = it.name + '  ('+(qi+1)+' из '+queue.length+')';
  if (mode === 'visual' && $('app').classList.contains('player')) $('path').textContent = it.name;
  updateMediaSession();
  updateMusicLine();
  sendState();
}

// Media Session отдаёт очередь системе: встроенный плеер приставки и её
// собственные кнопки начинают листать серии сами. Без него «следующая серия»
// живёт только внутри страницы, а во весь экран страница уже не видна.
function updateMediaSession(){
  if (!('mediaSession' in navigator)) return;
  const it = queue[qi];
  if (!it) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: it.name, artist: $('path').textContent, album: 'Habits TV' });
  } catch(e) {}
  const set = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch(e){} };
  set('play', () => v.play());
  set('pause', () => v.pause());
  set('previoustrack', qi > 0 ? actions.prev : null);
  // «следующая» есть всегда: за концом очереди может быть следующий сезон
  set('nexttrack', actions.next);
  set('seekbackward', actions.back);
  set('seekforward', actions.fwd);
  set('seekto', d => { if (d.seekTime != null) v.currentTime = d.seekTime; });
}

function playMusic(){
  const it = musicQueue[mi];
  if (!it) return;
  cancelFade();
  // видео НЕ трогаем — только пауза: место в серии сохраняется в самом
  // элементе, и возврат к просмотру мгновенный
  if (!v.paused) v.pause();
  a.src = it.url;
  a.play().catch(()=>{});
  updateMusicLine();
}

function setMusicQueue(list, idx){
  cancelFade();
  musicQueue = list;
  buildOrder(idx);
}

// Порядок игры с текущим треком на своём месте: включили перемешивание
// посреди трека — он доигрывает, дальше идут остальные вперемешку.
function buildOrder(current){
  const n = musicQueue.length;
  morder = [...Array(n).keys()];
  if (musicShuffle && n > 1) {
    const rest = morder.filter(i => i !== current);
    for (let i = rest.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rest[i], rest[j]] = [rest[j], rest[i]];
    }
    morder = current >= 0 && current < n ? [current, ...rest] : rest;
  }
  mpos = Math.max(0, morder.indexOf(current));
  mi = n ? morder[mpos] : -1;
}

// Шаг по очереди. auto — трек доиграл сам: тогда решает режим повтора.
// Руками «⏭» с последнего трека идёт на первый только в режиме «весь
// плейлист»; иначе остаётся на месте, как раньше.
function musicStep(dir, auto){
  const n = morder.length;
  if (!n) return false;
  if (auto && musicRepeat === 'one') { a.currentTime = 0; a.play().catch(()=>{}); return true; }
  let p = mpos + dir;
  if (p >= n || p < 0) {
    if (musicRepeat !== 'all') return false;
    if (p >= n && musicShuffle && n > 1) {
      // новый круг вперемешку, но не с того же трека, что только что играл
      const last = mi;
      buildOrder(-1);
      if (morder[0] === last) morder.push(morder.shift());
      p = 0;
    } else {
      p = (p + n) % n;
    }
  }
  mpos = p;
  mi = morder[mpos];
  playMusic();
  return true;
}

const REPEAT_LABEL = {once:'➡ Один раз', all:'🔁 Весь плейлист', one:'🔂 Один трек'};
function renderMusicModes(){
  document.querySelectorAll('[data-m="repeat"]').forEach(b => {
    b.textContent = REPEAT_LABEL[musicRepeat];
    b.title = 'Как играть: один раз, весь плейлист по кругу или один трек по кругу';
    b.classList.toggle('on', musicRepeat !== 'once');
  });
  document.querySelectorAll('[data-m="fade"]').forEach(b => {
    b.textContent = '〰 Плавно';
    b.title = musicFade ? 'Плавный переход между треками: включён' : 'Плавный переход между треками: выключен';
    b.classList.toggle('on', musicFade);
  });
  document.querySelectorAll('[data-m="shuffle"]').forEach(b => {
    b.textContent = musicShuffle ? '🔀' : '🔢';
    b.title = musicShuffle ? 'Случайный порядок' : 'Прямой порядок';
    b.classList.toggle('on', musicShuffle);
  });
}

function updateMusicLine(){
  const it = musicQueue[mi];
  const text = !it ? 'Музыка: не выбрана' : (a.paused ? 'Музыка на паузе: ' : 'Музыка: ') + it.name;
  $('mtitle').textContent = text;
  $('vmtitle').textContent = text;
  $('vmusic').classList.toggle('on', !!it);
  $('app').classList.toggle('music-on', !!it);
  updateQueueProgress();
  markPlayingRow();
  if (!$('qlist').hidden) renderQueue();
}

// --- окно очереди ---
//
// «☰ Плейлист» на панели музыки: что играет сейчас и что дальше, текущий
// трек выделен, внизу — сколько трека прошло. Любую строку можно включить.

function toggleQueue(force){
  const box = $('qlist');
  const show = force !== undefined ? force : box.hidden;
  if (!show) { box.hidden = true; return; }
  if (!musicQueue.length) return osd('🎵 Музыка не выбрана');
  renderQueue();
  box.hidden = false;
  const cur = $('qbody').querySelector('.qrow.cur') || $('qbody').firstElementChild;
  if (cur) { cur.focus({preventScroll:true}); cur.scrollIntoView({block:'center'}); }
}

function renderQueue(){
  const order = morder.length ? morder : musicQueue.map((_, i) => i);
  $('qsub').textContent = order.length + ' ' + plural(order.length,'трек','трека','треков') +
    (musicShuffle ? ' · 🔀' : '') + ' · ' + REPEAT_LABEL[musicRepeat];
  $('qbody').innerHTML = order.map((qi, pos) => {
    const it = musicQueue[qi];
    if (!it) return '';
    const cur = pos === mpos;
    return '<button class="qrow'+(cur ? ' cur' : '')+'" data-qi="'+pos+'">'+
      '<span class="n">'+(cur ? (a.paused ? '⏸' : '♪') : (pos + 1))+'</span>'+
      '<span class="nm">'+escapeHtml(it.name.replace(/\.[^.]+$/, ''))+'</span></button>';
  }).join('');
  updateQueueProgress();
}

// Прогресс трека: тонкой полоской на самой панели музыки (видно всегда, пока
// что-то играет) и подробно — в окне очереди.
function updateQueueProgress(){
  const d = a.duration, t = a.currentTime || 0;
  const known = isFinite(d) && d > 0;
  const pct = known ? Math.min(100, t / d * 100) : 0;
  const width = (musicQueue.length && known ? pct.toFixed(1) : 0)+'%';
  $('vmprog').style.width = width;
  $('mprog').style.width = width;
  if ($('qlist').hidden) return;
  $('qfill').style.width = pct.toFixed(1)+'%';
  $('qnow').textContent = fmt(t);
  $('qleft').textContent = known ? fmt(d) : '—';
  $('qpct').textContent = known ? Math.round(pct)+'%' : '';
}

onAudio('timeupdate', updateQueueProgress);

$('qlist').addEventListener('click', e => {
  const row = e.target.closest('[data-qi]');
  if (row) {
    mpos = +row.dataset.qi;
    mi = morder.length ? morder[mpos] : mpos;
    playMusic();
    return renderQueue();
  }
  const b = e.target.closest('[data-q]');
  if (!b) return;
  if (b.dataset.q === 'close') return toggleQueue(false);
  if (b.dataset.q === 'playpause') { musicActions.playpause(); renderQueue(); }
});

// У музыки свои кнопки: видео при этом остаётся ровно там, где стояло —
// его элемент не трогаем, поэтому возврат к просмотру мгновенный.
const musicActions = {
  playpause(){
    if (!musicQueue.length) return;
    if (a.paused){ if (!v.paused) v.pause(); a.play().catch(()=>{}); }
    else a.pause();
  },
  stop(){ cancelFade(); a.pause(); a.currentTime = 0; updateMusicLine(); },
  fade(){
    musicFade = !musicFade;
    store.set('htv.mfade', musicFade);
    if (!musicFade) cancelFade();
    renderMusicModes();
  },
  prev(){ musicStep(-1, false); },
  next(){ musicStep(1, false); },
  repeat(){
    musicRepeat = {once:'all', all:'one', one:'once'}[musicRepeat];
    store.set('htv.mrepeat', musicRepeat);
    renderMusicModes();
  },
  pick(){ toggleMusicPick(); },
  queue(){ toggleQueue(); },
  shuffle(){
    musicShuffle = !musicShuffle;
    store.set('htv.mshuffle', musicShuffle);
    if (musicQueue.length) buildOrder(mi);
    renderMusicModes();
  },
};
renderMusicModes();

v.addEventListener('timeupdate', () => {
  $('pos').textContent = fmt(v.currentTime)+' / '+fmt(v.duration);
});
v.addEventListener('ended', async () => {
  saveProgress(true);   // досмотрено — агент переведёт запись на следующую серию
  hideSkip();
  if (sleepMode === 'ep') {
    // «после этой серии» — дальше не идём
    setSleep(0);
    if (!a.paused) a.pause();
    osd('🌙 Серия закончилась — спокойной ночи', true);
    return;
  }
  if (qi+1 < queue.length){ qi++; playVideo(); return; }
  const more = await onQueueEnd();
  if (more) return;
  // досмотрели всё — «Продолжить» на главной больше не нужно
  queue = []; qi = -1;
  $('now').firstElementChild.textContent = 'Ничего не играет';
  sendState();
  if (mode === 'visual' && $('app').classList.contains('player')) leavePlayer();
});
onAudio('ended', () => { if (fadeTo) return finishFade(); if (!musicStep(1, true)) updateMusicLine(); });

// --- плавный переход между треками ---
//
// За FADE секунд до конца трека следующий начинает играть на втором элементе:
// громкость одного уходит, другого приходит. Когда старый доиграл, роли
// меняются. Пауза посреди перехода отменяет его — старый трек доиграет сам.
// В режиме «один трек» и на последнем треке «один раз» перехода нет.


function nextMusicPos(){
  const n = morder.length;
  if (!n || musicRepeat === 'one') return -1;
  if (mpos + 1 < n) return mpos + 1;
  return musicRepeat === 'all' ? 0 : -1;
}

onAudio('timeupdate', () => {
  const d = a.duration, rem = d - a.currentTime;
  if (!musicFade || a.paused || !isFinite(d) || d < FADE * 3) return;
  if (!fadeTo && rem <= FADE) {
    const p = nextMusicPos();
    const it = p >= 0 && musicQueue[morder[p]];
    if (!it) return;
    const el = audios.find(x => x !== a);
    musicVol = a.volume || musicVol;
    el.src = it.url;
    el.volume = 0;
    el.play().catch(() => {});
    fadeTo = {el, pos: p};
  }
  if (fadeTo) {
    const k = Math.max(0, Math.min(1, rem / FADE));
    a.volume = musicVol * k;
    fadeTo.el.volume = musicVol * (1 - k);
    // Трек кончился — меняем элементы местами сами, не дожидаясь событий:
    // Chrome в конце присылает ещё и «паузу», а она отменяла переход, и
    // следующий трек начинался заново с нуля.
    if (rem <= 0.25) finishFade();
  }
});

function finishFade(){
  const old = a, f = fadeTo;
  fadeTo = null;
  a = f.el;
  a.volume = musicVol;
  mpos = f.pos;
  mi = morder[mpos];
  old.pause();
  old.removeAttribute('src');
  old.volume = musicVol;
  updateMusicLine();
  sendState();
}

function cancelFade(){
  if (!fadeTo) return;
  const el = fadeTo.el;
  fadeTo = null;
  el.pause();
  el.removeAttribute('src');
  a.volume = musicVol;
}

// --- выбор музыки в панели плеера ---
//
// Смотрят фильм, хотят музыку, а очереди нет — раньше играть было нечего:
// музыку выбирали только в каталоге. Теперь папки музыки — кнопками прямо в
// панели. Пока ничего не выбрано, список открыт сам.

// Откуда брать музыку: свои плейлисты и папки музыки.
async function musicLibs(){
  if (!(catalog.music || []).length && !(catalog.playlists || []).length) {
    try { catalog = await getJSON('/api/catalog'); } catch(e) {}
  }
  return (catalog.playlists || []).concat(catalog.music || []);
}

async function toggleMusicPick(force){
  const box = $('mpick');
  const show = force !== undefined ? force : box.hidden;
  if (!show) { box.hidden = true; return; }
  const libs = await musicLibs();
  box.innerHTML = '<span class="lbl">'+(musicQueue.length ? 'Сменить музыку:' : 'Музыка не выбрана — выберите папку:')+'</span>'+
    (libs.length ? libs.map((t, i) =>
      '<button class="btn" data-mlib="'+i+'">'+(t.kind === 'playlist' ? '🎶 ' : '🎵 ')+escapeHtml(t.name)+' · '+t.count+'</button>'+
      // у альбома с подпапками можно взять и отдельную часть
      ((t.seasons||[]).map((d, j) => '<button class="btn" data-mlib="'+i+'" data-mpart="'+j+'">↳ '+escapeHtml(d.name)+' · '+d.count+'</button>').join(''))
    ).join('') : '<span class="lbl">Музыкальных папок нет</span>');
  box.hidden = false;
}

$('mpick').addEventListener('click', async e => {
  const b = e.target.closest('[data-mlib]');
  if (!b) return;
  const t = (await musicLibs())[+b.dataset.mlib];
  if (!t) return;
  const part = b.dataset.mpart !== undefined && (t.seasons||[])[+b.dataset.mpart];
  const tracks = await tracksOf(part ? part.id : t.id);
  if (!tracks.length) { $('mtitle').textContent = 'В папке «'+(part ? part.name : t.name)+'» нет треков, которые играют'; return; }
  setMusicQueue(tracks, musicShuffle ? Math.floor(Math.random() * tracks.length) : 0);
  $('mpick').hidden = true;
  // идёт фильм — только выбираем (заиграет по ▶ или на паузе с галочкой);
  // видео стоит — играем сразу
  if (!v.paused) { a.src = musicQueue[mi].url; updateMusicLine(); }
  else playMusic();
  const first = $('mbar').querySelector('[data-m="playpause"]');
  if (first) first.focus();
});

// --- музыка на паузе ---
//
// Поставили видео на паузу, смотря его, — заиграла музыка; видео снова пошло —
// музыка встала (на паузу: в следующий раз продолжит с того же места).
// Паузы, которые ставит сама страница, не в счёт: выход из плеера в каталог,
// конец серии, «⏹», включение музыки руками.

function setMusicOnPause(on){
  musicOnPause = on;
  try { sessionStorage.setItem('htv.musicOnPause', on ? '1' : '0'); } catch(e) {}
  const b = $('musicpause');
  b.textContent = (on ? '☑' : '☐') + ' Музыка на паузе';
  b.classList.toggle('on', on);
  // включили, когда видео уже стоит, — музыка сразу
  if (on && v.paused && watchingVideo()) pauseMusicStart();
}

function watchingVideo(){
  if (!v.getAttribute('src') || v.ended || sleeping || casting) return false;
  if (mode === 'visual') return $('app').classList.contains('player') || $('app').classList.contains('theater');
  return true;
}

let musicFetching = false;
async function pauseMusicStart(){
  // событие паузы приходит с опозданием: видео могли уже снова запустить
  if (!v.paused || !a.paused || musicFetching) return;
  if (!musicQueue.length) {
    // очереди ещё нет — первая музыкальная библиотека, в выбранном порядке
    musicFetching = true;
    try {
      const lib = (await musicLibs())[0];
      if (!lib) return;
      const tracks = await tracksOf(lib.id);
      // пока грузили, видео могли снова запустить или галочку снять
      if (!tracks.length || !musicOnPause || !v.paused || !a.paused) return;
      setMusicQueue(tracks, musicShuffle ? Math.floor(Math.random() * tracks.length) : 0);
      playMusic();
    } finally {
      musicFetching = false;
    }
    return;
  }
  if (!a.getAttribute('src')) return playMusic();
  a.play().catch(()=>{});
  updateMusicLine();
}

v.addEventListener('pause', () => { if (musicOnPause && watchingVideo()) pauseMusicStart(); });
v.addEventListener('play', () => { if (musicOnPause && !a.paused) a.pause(); });
onAudio('play', updateMusicLine);
onAudio('pause', e => {
  // «пауза» в конце трека (так делает Chrome) — не повод отменять переход
  if (fadeTo && !e.target.ended) cancelFade();
  updateMusicLine();
});

const actions = {
  playpause(){ if (!v.src) return; if (v.paused) v.play(); else v.pause(); },
  stop(){
    saveProgress(false);
    v.pause(); v.removeAttribute('src'); v.load();
    queue = []; qi = -1; plan = null;
    $('now').firstElementChild.textContent='Ничего не играет';
    if (mode === 'visual') leavePlayer();
  },
  back(){ v.currentTime = Math.max(0, v.currentTime-30); },
  fwd(){ v.currentTime = Math.min(v.duration||1e9, v.currentTime+30); },
  musicpause(){ setMusicOnPause(!musicOnPause); },
  marks(){ $('markpanel').hidden = !$('markpanel').hidden; renderMarkPanel(); },
  skiptoggle(){ toggleSkip(); },
  sleep(){
    const i = SLEEP_STEPS.indexOf(sleepMode);
    setSleep(SLEEP_STEPS[(i + 1) % SLEEP_STEPS.length]);
  },
  prev(){ if (qi>0){ saveProgress(false); qi--; playVideo(); } },
  next(){ saveProgress(false); if (qi+1<queue.length){ qi++; playVideo(); } else onQueueEnd(); },
  full(){
    // Свой режим на CSS — основной: Fullscreen API в вебвью приставки не
    // отрабатывает, а команда с пульта вообще не жест на телевизоре, и
    // браузер её отклонил бы. Родной полный экран пробуем следом, «в подарок».
    if (mode === 'visual' && queue[qi]) $('app').classList.add('player');
    const on = $('app').classList.toggle('theater');
    try {
      if (on && v.requestFullscreen) v.requestFullscreen().catch(()=>{});
      else if (!on && document.fullscreenElement) document.exitFullscreen();
    } catch(e) {}
  },
};
document.querySelectorAll('[data-m]').forEach(b => { b.onclick = () => musicActions[b.dataset.m](); });
$('bar').querySelectorAll('button').forEach(b => { b.onclick = () => actions[b.dataset.a](); });
setMusicOnPause(musicOnPause);

// --- перекодирование ---

// Приставка играет только MP4. MKV и AVI сюда и попадают: молча ничего не
// делать нельзя — иначе нажатие выглядит как сломанное.
async function transcode(it){
  $('jobs').innerHTML = '<div class="job">Ставлю в очередь: '+escapeHtml(it.name)+'…</div>';
  if (mode === 'visual') $('path').textContent = 'Перекодирую: '+it.name+' — прогресс в режиме «Файлы»';
  const r = await fetch(BASE+'/api/jobs', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id: it.id})}).then(r=>r.json()).catch(e=>({error:String(e)}));
  if (r.error) $('jobs').innerHTML = '<div class="job warn">'+escapeHtml(r.error)+'</div>';
  else pollJobs();
}

// --- связь с пультом ---
//
// Прод здесь только шина: он пересылает JSON и ничего о нём не знает. Списки
// папок приставка берёт у своего агента по локальной сети и отдаёт пульту
// сама, поэтому пути файлов и медиа через сервер не идут.

const ROOM = '{{ROOM}}', HUB = '{{HUB}}';
let hub = null, hubTimer = null;

function hubConnect(){
  if (!HUB || !ROOM) return;
  try { hub = new WebSocket(HUB + '?room=' + encodeURIComponent(ROOM)); }
  catch(e) { return hubRetry(); }
  hub.onopen = () => { sendState(); sendJobs(); };
  hub.onclose = hubRetry;
  hub.onerror = () => { try { hub.close(); } catch(e){} };
  hub.onmessage = async e => {
    let m; try { m = JSON.parse(e.data); } catch(err) { return; }
    if (m.t === 'code') return showCode(m.code);
    if (m.t === 'screen') return setScreen(m.id);
    if (m.t === 'presence') return showScreens(m.screens);
    await onRemote(m);
  };
}

// Код показываем в двух местах: крупно на экране разблокировки и мелко в углу,
// чтобы подключить второй телефон, не выходя из плеера.
let lastCode = '';
function showCode(code){
  lastCode = code || lastCode;
  const pretty = lastCode ? lastCode.slice(0,4) + ' ' + lastCode.slice(4) : '…';
  $('code').textContent = pretty;
  $('codeline').textContent = 'код: ' + pretty + screenLabel;
  $('corner').textContent = 'код: ' + pretty + screenLabel;
}
// Приставка стоит включённой сутками, а вайфай и прод перезапускаются:
// без переподключения пульт замолкал бы навсегда после первой же икоты.
function hubRetry(){
  clearTimeout(hubTimer);
  hubTimer = setTimeout(hubConnect, 4000);
}
// Свой номер экрана. У одного агента плееров может быть несколько (телевизор
// и компьютер) — они сидят в одной комнате и раньше отвечали пульту наперебой,
// а команды получали оба. Теперь каждый ответ подписан номером, и пульт
// выбирает, с каким экраном говорит.
let screenID = '';

function setScreen(id){
  screenID = id || '';
  hubSend({t:'iam', name: screenName()});
  sendState();
}

// Плееров у одного агента может быть несколько. Когда их больше одного,
// показываем рядом с кодом, какой это экран: иначе непонятно, каким из них
// управляет пульт.
let screenLabel = '';
function showScreens(list){
  const many = Array.isArray(list) && list.length > 1;
  const me = many && list.find(x => x.id === screenID);
  screenLabel = me ? ' · ' + (me.name || 'экран') : '';
  showCode(lastCode);
}

function screenName(){
  if (IN_APP) return 'Приложение на ТВ';
  return /Android|SmartTV|TV/i.test(navigator.userAgent) ? 'Браузер приставки' : 'Браузер компьютера';
}

function hubSend(obj){
  if (hub && hub.readyState === 1) hub.send(JSON.stringify(Object.assign({s: screenID}, obj)));
}

async function onRemote(m){
  switch (m.t){
    case 'hello': sendState(); sendJobs(); break;
    case 'browse': {
      // пульт листает библиотеку САМ, экран приставки при этом не трогаем:
      // выбирать следующую серию, не сбивая текущую картинку, — обычное дело
      const url = m.id ? '/api/browse?id='+encodeURIComponent(m.id) : '/api/libraries';
      try {
        const r = await getJSON(url);
        const list = m.id ? r.items : (r.libraries||[]).map(l=>({id:l.id,name:l.title,is_dir:true}));
        hubSend({t:'items', id:m.id||'', items:list||[], error:r.error||''});
      } catch(err){ hubSend({t:'items', id:m.id||'', items:[], error:String(err)}); }
      break;
    }
    case 'open': {
      // очередь собирается из того, что прислал пульт: он видит ту же папку.
      // Куда играть, решает СОДЕРЖИМОЕ файла, а не пожелание пульта: трек без
      // видеодорожки в видеоплеере — это чёрный экран вместо музыки.
      const list = (m.items||[]).filter(x=>!x.is_dir && x.url);
      const it = list.find(x=>x.id===m.id);
      if (!it) break;
      startFrom(list, it, m.as === 'music' ? 'music' : '');
      if (m.as !== 'music' && hasVideo(it)) showPlayer();
      sendState();
      break;
    }
    case 'cast': showCast(m); break;
    case 'cast-stop': closeCast(); break;
    // показ с телефона на экране — кнопки пульта управляют им
    case 'cmd': if (castOpen() && castActions[m.a]) { castActions[m.a](); sendState(); }
                else if (actions[m.a]) { actions[m.a](); sendState(); } break;
    case 'mcmd': if (musicActions[m.a]) { musicActions[m.a](); sendState(); } break;
    case 'seek': if (isFinite(m.to)) { (castOpen() && !$('castvid').hidden ? $('castvid') : v).currentTime = m.to; sendState(); } break;
    case 'volume': if (isFinite(m.value)) { v.volume = a.volume = musicVol = Math.min(1, Math.max(0, m.value)); sendState(); } break;
    case 'transcode': if (m.id) { await transcode({id:m.id, name:m.name||''}); sendJobs(); } break;
  }
}

// --- «Отправить на ТВ» ---
//
// Фото или ролик из галереи телефона — сразу на экран, без библиотеки. Файл
// лежит на проде пару часов (по случайной ссылке), приставка берёт его
// оттуда: телефон может быть и не в домашнем вайфае. Адрес — рядом с шиной.

const CAST_BASE = HUB ? HUB.replace(/^wss:/, 'https:').replace(/^ws:/, 'http:').replace(/\/socket$/, '/cast/') : '';

// Сериал на время показа встаёт на паузу и продолжается с того же места,
// когда показ закрыли. Пауза тут не «зрительская»: музыка по галочке
// «Музыка на паузе» включаться не должна.
let casting = false, castResume = false;

function showCast(m){
  if (!CAST_BASE || !/^[0-9a-f]{16,64}$/.test(m.token || '')) return;
  const url = CAST_BASE + m.token;
  if (!casting) castResume = !v.paused && !!v.getAttribute('src');
  casting = true;
  if (!v.paused) v.pause();
  const img = $('castimg'), vid = $('castvid');
  const isVideo = m.kind === 'video';
  $('castcap').textContent = '📱 '+(m.name || 'С телефона')+
    (isVideo ? ' · OK — пауза, ←/→ — 30 с' : '')+' · «Назад» — закрыть'+
    (castResume ? ' и вернуться к просмотру' : '');
  if (isVideo) {
    img.hidden = true; img.removeAttribute('src');
    vid.hidden = false; vid.src = url; vid.play().catch(() => {});
  } else {
    vid.hidden = true; vid.pause(); vid.removeAttribute('src');
    img.hidden = false; img.src = url;
  }
  $('cast').classList.add('on');
  sendState();
}

function closeCast(){
  if (!$('cast').classList.contains('on')) return false;
  const vid = $('castvid');
  vid.pause(); vid.removeAttribute('src'); vid.load();
  $('castimg').removeAttribute('src');
  $('cast').classList.remove('on');
  casting = false;
  // вернулись к тому, что смотрели: место сохранилось в самом элементе
  if (castResume) { castResume = false; v.play().catch(() => {}); }
  sendState();
  return true;
}

// Кнопки пульта и стрелки, пока на экране показ с телефона: они относятся к
// нему, а не к сериалу под ним.
const castActions = {
  playpause(){ const c = $('castvid'); if (c.hidden) return; if (c.paused) c.play().catch(()=>{}); else c.pause(); },
  back(){ const c = $('castvid'); if (!c.hidden) { c.currentTime = Math.max(0, c.currentTime - 30); castOSD('⏪'); } },
  fwd(){ const c = $('castvid'); if (!c.hidden) { c.currentTime = Math.min(c.duration || 1e9, c.currentTime + 30); castOSD('⏩'); } },
  stop(){ closeCast(); },
  full(){ /* показ и так во весь экран */ },
};

function castOSD(sign){
  const c = $('castvid');
  osd(sign+' '+fmt(c.currentTime)+(isFinite(c.duration) && c.duration > 0 ? ' / '+fmt(c.duration) : ''));
}

function castOpen(){ return $('cast').classList.contains('on'); }

function sendState(){
  const it = queue[qi], mit = musicQueue[mi];
  const cv = $('castvid');
  hubSend({t:'state',
    cast: castOpen() ? {video: !cv.hidden, paused: cv.hidden ? true : cv.paused,
                        time: cv.currentTime||0, duration: cv.duration||0} : null,
    video: it ? {name: it.name, index: qi+1, total: queue.length,
                 paused: v.paused, time: v.currentTime||0, duration: v.duration||0} : null,
    music: mit ? {name: mit.name, index: mpos+1, total: musicQueue.length,
                  paused: a.paused} : null,
    volume: v.volume});
}
function sendJobs(){
  getJSON('/api/jobs').then(r => hubSend({t:'jobs', jobs: r.jobs||[]})).catch(()=>{});
}
// раз в секунду во время игры — пульту нужна ползущая позиция, но слать
// состояние на каждый timeupdate (4 раза в секунду) незачем
setInterval(() => { if (!v.paused || !a.paused) sendState(); }, 1000);
v.addEventListener('play', sendState);
v.addEventListener('pause', sendState);
onAudio('play', sendState);
onAudio('pause', sendState);
hubConnect();

let jobTimer = null;
async function pollJobs(){
  clearTimeout(jobTimer);
  let active = false;
  try{
    const r = await getJSON('/api/jobs');
    const names = {queued:'в очереди', running:'идёт', done:'готово', failed:'ошибка', stopped:'остановлено'};
    $('jobs').innerHTML = (r.jobs||[]).slice(0,6).map(j => {
      if (j.status==='queued'||j.status==='running') active = true;
      return '<div class="job">'+escapeHtml(j.name)+' — '+names[j.status]+
        (j.status==='running' ? ' '+j.percent+'% ('+(j.speed||'')+')' : '')+
        (j.error ? ' <span class="warn">'+escapeHtml(j.error)+'</span>' : '')+
        (j.status==='running' ? '<div class="prog"><i style="width:'+j.percent+'%"></i></div>' : '')+
        '</div>';
    }).join('') || '';
  }catch(e){}
  // пока что-то считается — раз в 2 секунды, потом раз в 15: опрашивать
  // впустую незачем, а без опроса прогресс не обновится
  jobTimer = setTimeout(pollJobs, active ? 2000 : 15000);
}

// --- обновить ---
//
// Каталог страница берёт при входе в визуальный режим, а приставка живёт
// сутками: залили новый сериал — без кнопки его не видно до перезапуска.
// Обновляется то, что на экране: каталог, открытый сериал, папка фото,
// папка в режиме «Файлы». Играющее видео не трогается.

async function refreshAll(){
  const btn = $('refresh');
  btn.classList.add('spin');
  try {
    if (!$('admin').hidden) return await adminRender();
    if (mode === 'files') {
      const top = stack[stack.length-1];
      if (!top) return await openLibraries();
      stack.pop();
      return await openDir(top.id, top.name);
    }
    const [cat] = await Promise.all([getJSON('/api/catalog'), loadProgress()]);
    catalog = cat;
    // открытый сериал или папку сверяем с новым каталогом: удалили — на главную
    for (let i = vstack.length - 1; i >= 0; i--) {
      const x = vstack[i];
      if (x.kind === 'photos') continue;
      const fresh = findTile(x.kind+':'+x.tile.id);
      if (fresh) x.tile = fresh; else vstack.splice(i);
    }
    const top = vstack[vstack.length-1];
    if (top && top.kind === 'photos') {
      const r = await getJSON('/api/photos?id='+encodeURIComponent(top.tile.id)).catch(() => null);
      if (!r || !r.photos) vstack.pop();
      else { top.photos = r.photos; top.dirs = r.dirs || []; top.index = Math.min(top.index, Math.max(0, r.photos.length-1)); }
    }
    if (!$('app').classList.contains('player')) renderVisual();
    if (!$('mpick').hidden) toggleMusicPick(true);
  } catch(e) {
    $('path').textContent = 'Не обновилось: '+e.message;
  } finally {
    btn.classList.remove('spin');
  }
}
$('refresh').onclick = refreshAll;

// --- окно подтверждения и ввода ---

let modalResolve = null;

function modal(html, focusSel){
  $('mbox').innerHTML = html;
  $('amodal').hidden = false;
  return new Promise(res => {
    modalResolve = res;
    const el = $('mbox').querySelector(focusSel || '.btn');
    if (el) el.focus();
  });
}

function modalAnswer(ok){
  if ($('amodal').hidden) return;
  const input = $('mbox').querySelector('input');
  const value = ok ? (input ? input.value : true) : null;
  $('amodal').hidden = true;
  const res = modalResolve;
  modalResolve = null;
  if (res) res(value);
  // фокус — обратно туда, где был до окна
  if (adminState.lastFocus && document.body.contains(adminState.lastFocus)) adminState.lastFocus.focus();
}

$('mbox').addEventListener('click', e => {
  const b = e.target.closest('[data-modal]');
  if (b) modalAnswer(b.dataset.modal === 'ok');
});

function askConfirm(text, okLabel, danger){
  adminState.lastFocus = document.activeElement;
  return modal('<p>'+escapeHtml(text)+'</p><div class="mbtns">'+
    '<button class="btn" data-modal="cancel">Отмена</button>'+
    '<button class="btn '+(danger ? 'danger' : 'primary')+'" data-modal="ok">'+escapeHtml(okLabel)+'</button></div>',
    '[data-modal="cancel"]');
}

function askText(title, value, hint){
  adminState.lastFocus = document.activeElement;
  return modal('<p>'+escapeHtml(title)+'</p><input id="mval" value="'+escapeHtml(value)+'" spellcheck="false">'+
    (hint ? '<p class="tag">'+escapeHtml(hint)+'</p>' : '')+
    '<div class="mbtns"><button class="btn" data-modal="cancel">Отмена</button>'+
    '<button class="btn primary" data-modal="ok">Сохранить</button></div>', '#mval');
}

// --- админка ---
//
// Названия (переименование на диске), удаление через корзину на N дней,
// обслуживание кэша. PIN вводится один раз на устройстве и хранится в
// браузере приставки; неверный — спросим снова.

const adminState = {screen: 'pin', tab: 'lib', dir: null, pin: store.get('htv.adminPin', ''),
  pinInput: '', dirty: false, lastFocus: null, overview: null, items: {}, gen: 0};
// Ответы приходят не по порядку: переключили вкладку, пока грузилась прошлая, —
// опоздавший ответ не должен рисовать поверх. Каждая отрисовка берёт номер,
// устаревшая молча выходит.
const stale = gen => gen !== adminState.gen;

const SIZE_UNITS = ['Б','КБ','МБ','ГБ','ТБ'];
function fmtSize(n){
  let i = 0;
  while (n >= 1024 && i < SIZE_UNITS.length-1) { n /= 1024; i++; }
  return (i >= 3 ? n.toFixed(1) : Math.round(n)) + ' ' + SIZE_UNITS[i];
}

function adStatus(text, kind){
  const el = $('adstatus');
  el.textContent = text || '';
  el.className = kind || '';
}

async function adminFetch(url, opts){
  opts = opts || {};
  const headers = Object.assign({'X-Admin-Pin': adminState.pin}, opts.body ? {'Content-Type':'application/json'} : {});
  let r;
  try {
    r = await fetch(BASE+url, {method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined});
  } catch(e) { adStatus('Агент не отвечает: '+e.message, 'err'); return null; }
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 || r.status === 429 || (r.status === 403 && data.code === 'disabled')) {
    if (r.status === 401) { adminState.pin = ''; store.set('htv.adminPin', ''); }
    showPin(data.error || 'Нужен PIN', data.code === 'disabled');
    return null;
  }
  if (!r.ok) { adStatus(data.error || ('Ошибка '+r.status), 'err'); return null; }
  return data;
}

async function openAdmin(){
  $('admin').hidden = false;
  adStatus('');
  adminState.dir = null;
  if (!adminState.pin) return showPin('');
  const ok = await adminFetch('/api/admin/check');
  if (ok) { adminState.screen = 'main'; adminRender(); }
}
$('adminBtn').onclick = openAdmin;

function closeAdmin(){
  $('admin').hidden = true;
  stopMarkVideo();
  adminState.marks = null;
  $('prehear').pause();
  build.playing = '';
  if (adminState.dirty) { adminState.dirty = false; refreshAll(); }
  $('adminBtn').focus();
}

function adminBack(){
  if (adminState.screen === 'main' && adminState.tab === 'build' && build.pick) {
    if (build.pick.stack.length) build.pick.stack.pop(); else build.pick = null;
    return adminRender();
  }
  if (adminState.screen === 'main' && adminState.marks) {
    const mk = adminState.marks;
    stopMarkVideo();
    if (mk.file && (mk.season || mk.isDir)) mk.file = null;   // из редактора — к списку серий
    else if (mk.season) mk.season = null;                     // из серий — к сезонам
    else adminState.marks = null;
    return adminRender();
  }
  if (adminState.screen === 'main' && adminState.infoEdit) { adminState.infoEdit = null; return adminRender(); }
  if (adminState.screen === 'main' && adminState.picker) {
    const pk = adminState.picker;
    if (pk.albums.length) pk.albums.pop(); else adminState.picker = null;
    return adminRender();
  }
  if (adminState.screen === 'main' && adminState.tab === 'lib' && adminState.dir) {
    adminState.dir = adminState.dir.parent || null;
    return adminRender();

async function pinKey(k){
  if (k === 'del') adminState.pinInput = adminState.pinInput.slice(0, -1);
  else if (k === 'ok') {
    if (!adminState.pinInput) return;
    adminState.pin = adminState.pinInput;

  else if (adminState.pinInput.length < 12) adminState.pinInput += k;

}

async function adminRender(){
  if (adminState.screen !== 'main') return;
  const gen = ++adminState.gen;
  document.querySelectorAll('[data-adtab]').forEach(b => { b.hidden = false; b.classList.toggle('on', b.dataset.adtab === adminState.tab); });
  // фокус вернётся на ту же по счёту кнопку: после удаления строки — на соседнюю
  const before = [...$('adbody').querySelectorAll('button')].indexOf(document.activeElement);
  if (adminState.marks) await renderAdminMarks();
  else if (adminState.picker) await renderAdminPicker();
  else if (adminState.infoEdit) await renderAdminInfo();
  else if (adminState.tab === 'lib') await (adminState.dir ? renderAdminDir() : renderAdminLib());
  else if (adminState.tab === 'trash') await renderAdminTrash();
  else if (adminState.tab === 'looks') await renderAdminLooks();
  else if (adminState.tab === 'stats') await renderAdminStats();
  else if (adminState.tab === 'build') await renderAdminBuild();
  else await renderAdminService();
  if (stale(gen)) return;
  const btns = [...$('adbody').querySelectorAll('button')];
  const target = before >= 0 ? btns[Math.min(before, btns.length-1)] : null;
  (target || btns[0] || document.querySelector('[data-adtab="'+adminState.tab+'"]')).focus();
}

function daysLeft(ts){
  const d = Math.max(0, Math.ceil((ts*1000 - Date.now()) / 86400000));
  return d ? 'через '+d+' '+plural(d,'день','дня','дней') : 'сегодня';
}
function fmtDate(ts){
  const d = new Date(ts*1000);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

// --- загрузка частями ---
//
// Перед агентом nginx, у него предел тела запроса 1 МБ по умолчанию, поэтому
// файл уходит кусками по 768 КБ. Кусок, который не дошёл, повторяется; если
// агент говорит «у меня уже столько» (409), продолжаем с его места.

async function uploadChunked(file, finishQuery, onProgress){
  const start = await adminFetch('/api/admin/upload', {method: 'POST', body: {name: file.name, size: file.size}});
  if (!start) return null;
  const chunk = start.chunk || 786432;
  let off = 0;
  while (off < file.size) {
    let done = false;
    for (let attempt = 1; !done; attempt++) {
      try {
        const r = await fetch(BASE+'/api/admin/upload/'+start.id+'?offset='+off,
          {method: 'PUT', headers: {'X-Admin-Pin': adminState.pin}, body: file.slice(off, off + chunk)});
        const d = await r.json().catch(() => ({}));
        if (r.ok || (r.status === 409 && d.size !== undefined)) { off = d.size; done = true; }
        else throw new Error(d.error || 'ошибка '+r.status);
      } catch(e) {
        if (attempt >= 5) { adStatus('Загрузка оборвалась: '+e.message+' — повторите', 'err'); return null; }
        await new Promise(res => setTimeout(res, 1000 * attempt));
      }
    }
    if (onProgress) onProgress(off / file.size);
  }
  adStatus('Обрабатываю…');
  return adminFetch('/api/admin/upload/'+start.id+'/finish?'+finishQuery, {method: 'POST'});
}

    field('ratings', 'Рейтинги', (inf.ratings || []).map(r => r.source+': '+r.value).join('; '))+
    field('description', 'Описание', inf.description ? (inf.description.length > 180 ? inf.description.slice(0, 180)+'…' : inf.description) : '')+
    field('actors', 'Актёры', (inf.actors || []).join(', '))+
    '<p class="tag">Сведения ищутся по названию папки или файла: IMDb, Wikidata, Википедия, TVmaze (для сериалов). Жанры и актёров пишите через запятую, рейтинги — «Источник: оценка» через точку с запятой.</p>';
}

async function editInfoField(key){
  const ie = adminState.infoEdit;
  const inf = Object.assign({}, ie.info || {});
  const cur = {
    title: inf.title || '', year: inf.year ? String(inf.year) : '', genres: (inf.genres || []).join(', '),
    ratings: (inf.ratings || []).map(r => r.source+': '+r.value).join('; '), description: inf.description || '',
    actors: (inf.actors || []).join(', '),
  }[key];
  const label = {title: 'Название', year: 'Год', genres: 'Жанры через запятую', ratings: 'Рейтинги: «Источник: оценка; …»',
    description: 'Описание', actors: 'Актёры через запятую'}[key];
  const val = await askText(label, cur, '');
  if (val === null) return;
  const list = v => v.split(',').map(x => x.trim()).filter(Boolean);
  if (key === 'title') inf.title = val.trim();
  if (key === 'year') inf.year = parseInt(val, 10) || 0;
  if (key === 'genres') inf.genres = list(val);
  if (key === 'actors') inf.actors = list(val);
  if (key === 'description') inf.description = val.trim();
  if (key === 'ratings') inf.ratings = val.split(';').map(x => x.trim()).filter(Boolean).map(x => {
    const i = x.indexOf(':');
    return i > 0 ? {source: x.slice(0, i).trim(), value: x.slice(i + 1).trim()} : {source: 'Оценка', value: x};
  });
  const r = await adminFetch('/api/admin/info', {method: 'POST', body: {id: ie.id, info: inf}});
  if (r) { ie.info = r.info; adStatus('Сохранено', 'ok'); adminRender(); }
}

    '<div class="mbtns"><button class="btn" data-modal="cancel">Отмена</button></div>', '[data-into="files"]');
  if (!choice || !adminState.intoMode) return;
  const mode = adminState.intoMode;

$('mbox').addEventListener('click', e => {
  const b = e.target.closest('[data-into]');

});

$('adfiles').addEventListener('change', async () => {
  const files = [...$('adfiles').files];
  $('adfiles').value = '';
  const into = adminState.uploadInto;
  if (!files.length || !into) return;
  let done = 0, failed = 0;
  for (const f of files) {
    const r = await uploadChunked(f, 'target=into&id='+encodeURIComponent(into.id),
      p => adStatus('Загружаю «'+f.name+'» ('+(done + 1)+' из '+files.length+')… '+Math.round(p * 100)+'%'));
    if (r) done++; else failed++;
  }
  adminState.dirty = true;
  adStatus('В «'+into.name+'» добавлено: '+done+(failed ? ', не вышло: '+failed : ''), failed ? 'err' : 'ok');
  if (build.target && build.target.id === into.id) await loadBuildSource(build.source && build.source.id);
  adminRender();
});

// --- заставка и титры ---
//
// Порядок: открыли сериал «✂» → выбрали сезон → одну серию. Серия играет прямо
// в админке: доводите до нужного места (можно на паузе) и жмёте «Заставка
// начинается» / «Заставка кончается», так же для титров. «Титры до конца серии»
// — если после них ничего нет, а «Титры кончаются» — если после них есть сцена.
//
// Сохранить можно на весь сериал, на сезон или на одну серию: играет самая
// точная запись. У сериала с одинаковой заставкой достаточно одного раза.

const MK_VIDEO_EXT = /\.(mp4|m4v|mkv|avi|mov|ts|webm|mpg|mpeg|flv)$/i;

function stopMarkVideo(){
  const el = $('advid');
  if (el.hidden) return;

  el.removeAttribute('src');
  el.load();
  el.hidden = true;
}

async function openAdminMarks(id){
  const it = adminState.items[id] || {};

  adminState.marks = {id, name: it.name || '', isDir: !!it.is_dir, season: null, file: null,
    url: '', urls: {}, data: null, scope: 'series'};
  // фильм одним файлом — отмечать нечего выбирать, сразу редактор
  if (!it.is_dir) return openMarkFile(id, it.name || '');
  return adminRender();
}

async function renderAdminMarks(){
  const mk = adminState.marks, gen = adminState.gen;
  $('adpath').textContent = 'заставка и титры · '+mk.name;

  stopMarkVideo();
  $('adbody').innerHTML = '<div class="empty">Загрузка…</div>';
  const here = mk.season || {id: mk.id, name: mk.name};
  const r = await getJSON('/api/browse?id='+encodeURIComponent(here.id)).catch(() => null);
  if (!r || stale(gen)) return;
  const items = r.items || [];
  const dirs = items.filter(x => x.is_dir);

  files.forEach(f => { mk.urls[f.id] = f.url; });
  $('adbody').innerHTML =

      '<button class="btn" data-ad="back">← Назад</button></div>'+
    scanCard(here)+
    dirs.map(d => '<div class="arow"><div class="ainfo"><b>📁 '+escapeHtml(d.name)+'</b></div>'+
      '<button class="btn" data-admkdir="'+d.id+'" data-name="'+escapeHtml(d.name)+'">📂 Открыть</button></div>').join('')+
    files.map(f => '<div class="arow"><div class="ainfo"><b>🎬 '+escapeHtml(f.name)+'</b></div>'+
      '<button class="btn primary" data-admkfile="'+f.id+'" data-name="'+escapeHtml(f.name)+'">✂ Отмечать</button></div>').join('')+

}

// Открыть серию: ссылка на файл и записи всех трёх уровней.
async function openMarkFile(id, name){
  const mk = adminState.marks;
  // серию слушаем здесь — видео и музыка приставки одновременно не звучат
  if (!v.paused) v.pause();
  if (!a.paused) a.pause();
  mk.file = {id, name};
  mk.url = mk.urls[id] || '';
  if (!mk.url) {
    const r = await getJSON('/api/item?id='+encodeURIComponent(id)).catch(() => null);
    mk.url = (r && r.item && r.item.url) || '';
  }
  mk.data = await getJSON('/api/marks?file='+encodeURIComponent(id)).catch(() => null);
  if (mk.data && mk.data.season_id) mk.scope = 'season';
  return adminRender();
}

function markScopeName(scope){
  const d = (adminState.marks && adminState.marks.data) || {};
  if (scope === 'season') return 'сезона «'+(d.season_name || '')+'»';
  if (scope === 'episode') return 'этой серии';
  return d.kind === 'film' ? 'этого фильма' : 'всего сериала';
}

function markLine(m){
  if (!m || (!m.intro_end && !m.credits_from_end && !m.auto_skip)) return 'ничего не отмечено';
  const out = [];
  if (m.intro_end) out.push('заставка '+fmt(m.intro_start)+' – '+fmt(m.intro_end));
  if (m.credits_from_end) out.push('титры за '+fmt(m.credits_from_end)+' до конца'+
    (m.credits_end_from_end ? ', кончаются за '+fmt(m.credits_end_from_end) : ' и до самого конца'));
  if (m.auto_skip) out.push('заставка пропускается сама');
  return out.join(' · ');
}

      '<button class="btn" data-admk="intro-start">⏵ Заставка начинается</button>'+
      '<button class="btn" data-admk="intro-end">⏹ Заставка кончается</button>'+
      '<button class="btn" data-admk="credits-start">🎬 Титры начинаются</button>'+

      '<button class="btn" data-admk="credits-to-end">🏁 Титры до конца'+(d.kind === 'film' ? '' : ' серии')+'</button>'+
      '<button class="btn" data-admk="fromfile" title="В mkv часто есть главы «Intro» и «Credits» — возьмём тайминги оттуда">🔎 Взять из глав файла</button></div>'+
    '<div class="mkrow"><span class="lbl">Записать для</span>'+
      scopes.map(([v, label]) => '<button class="btn'+(mk.scope === v ? ' on' : '')+'" data-admkscope="'+v+'">'+escapeHtml(label)+'</button>').join('')+

    '<p class="tag">Играет самая точная запись: серия важнее сезона, сезон важнее сериала. Титры считаются от конца файла — серии разной длины, а титры одни и те же.</p>';

function updateMarkPos(){
  const el = $('mkpos');
