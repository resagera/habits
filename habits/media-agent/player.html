$('advid').addEventListener('loadedmetadata', updateMarkPos);

async function saveMark(what){
  const mk = adminState.marks, vid = $('advid');
  if (!mk || !mk.file) return;
  const t = vid.currentTime || 0, dur = vid.duration || 0;
  const cur = (mk.data && mk.data.marks) || {};
  const body = {file: mk.file.id, scope: mk.scope};
  const needDur = 'Серия ещё не загрузилась — подождите пару секунд';
  // тайминги, записанные в самом файле: главы «Intro», «Ending Credits»
  if (what === 'fromfile') {
    const c = await getJSON('/api/marks/chapters?file='+encodeURIComponent(mk.file.id)).catch(() => null);
    if (!c || !c.found || (!c.found.intro_end && !c.found.credits_from_end)) {
      return adStatus('В главах этого файла нет ни заставки, ни титров — отметьте руками', 'err');
    }
    if (c.found.intro_end) { body.intro_start = c.found.intro_start; body.intro_end = c.found.intro_end; }
    if (c.found.credits_from_end) {
      body.credits_from_end = c.found.credits_from_end;
      body.credits_end_from_end = c.found.credits_end_from_end;
    }
  }
  switch (what) {
    case 'intro-start': body.intro_start = t; break;
    case 'intro-end': body.intro_end = t; break;
    case 'credits-start':
      if (!dur) return adStatus(needDur, 'err');
      body.credits_from_end = Math.max(1, dur - t);
      body.credits_end_from_end = 0;
      break;
    case 'credits-end':
      if (!dur) return adStatus(needDur, 'err');
      body.credits_end_from_end = Math.max(0, dur - t);
      break;
    case 'credits-to-end': body.credits_end_from_end = 0; break;
    case 'auto': body.auto_skip = !cur.auto_skip; break;
    case 'reset': body.reset = true; break;
  }
  const r = await fetch(BASE+'/api/marks', {method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)}).then(r => r.json()).catch(() => null);
  if (!r || !r.marks) return adStatus('Не удалось сохранить отметку', 'err');
  mk.data = r;
  const told = {
    'intro-start': 'Заставка начинается с '+fmt(t),
    'intro-end': 'Заставка кончается на '+fmt(t),
    'credits-start': 'Титры начинаются за '+fmt(dur - t)+' до конца',
    'credits-end': 'Титры кончаются за '+fmt(dur - t)+' до конца',
    'credits-to-end': 'Титры идут до самого конца',
    'fromfile': 'Взято из глав файла',
    'auto': cur.auto_skip ? 'Заставку будем предлагать пропустить' : 'Заставка будет пропускаться сама',
    'reset': 'Сброшено у '+markScopeName(mk.scope),
  };
  adStatus(what === 'reset' ? told.reset : (told[what] || 'Сохранено')+' · для '+markScopeName(mk.scope), 'ok');
  // отметки читает и сам плеер: если играет эта же серия, подхватим сразу
  if (marksFor === mk.file.id) curMarks = r;
  const key = what;
  await adminRender();
  const again = $('adbody').querySelector('[data-admk="'+key+'"]');
  if (again) again.focus();
}

// --- заставка по звуку ---
//
// Заставка у серий одного сезона звучит одинаково — агент сравнивает звук и
// находит её сам (см. fingerprint.go). Здесь только кнопка, опрос хода работы
// и разбор ответа: отметки агент записывает сам, на уровне каждой серии.

let scanTimer = null;

function scanCard(here){
  const st = adminState.scan;
  const from = adminState.scanFromStart !== false;
  let body = '<div class="acard"><div class="ainfo"><b>🎧 Найти заставку и титры по звуку</b>'+
    '<span>агент послушает начало и конец каждой серии и отметит общий кусок — заставку и титры. '+
    'Минута-две на сезон, отметки лягут на каждую серию отдельно.</span></div>'+
    '<button class="btn'+(from ? ' on' : '')+'" data-adscanfrom="1">'+(from ? '☑' : '☐')+' Пропускать с самого начала</button>'+
    '<button class="btn primary" data-adscan="'+here.id+'">🎧 Найти</button></div>';
  if (st && (st.running || (st.episodes && st.episodes.length) || st.error)) {
    const pct = st.total ? Math.round(100 * st.done / st.total) : 0;
    body += '<div class="acard"><div class="ainfo"><b>'+escapeHtml(st.title || '')+' · '+
      (st.running ? escapeHtml(st.stage || '') : (st.error ? 'остановлено' : 'готово'))+'</b>'+
      '<span>'+st.done+' из '+st.total+(st.seconds ? ' · '+st.seconds+' с' : '')+
      (st.error ? ' · '+escapeHtml(st.error) : '')+'</span>'+
      '<div class="abar"><i style="width:'+pct+'%"></i></div></div>'+
      (st.running ? '<button class="btn danger" data-adscanstop="1">✖ Остановить</button>' : '')+'</div>'+
      (st.episodes || []).map(e => '<div class="arow"><div class="ainfo"><b>'+escapeHtml(e.name)+'</b>'+
        '<span class="apath">'+(e.intro_end ? 'заставка '+fmt(e.intro_start)+' – '+fmt(e.intro_end) : 'заставка не нашлась')+
        (e.credits_from_end ? ' · титры за '+fmt(e.credits_from_end)+' до конца' : '')+
        (e.note ? ' · '+escapeHtml(e.note) : '')+'</span></div></div>').join('');
  }
  return body;
}

async function pollScan(){
  clearTimeout(scanTimer);
  const st = await adminFetch('/api/admin/marks/scan');
  if (!st) return;
  adminState.scan = st;
  if (adminState.marks && !adminState.marks.file) await adminRender();
  if (st.running) scanTimer = setTimeout(pollScan, 2000);
  else adminState.dirty = true;
}

// --- статистика ---

async function renderAdminStats(){
  $('adpath').textContent = 'статистика';
  const gen = adminState.gen;
  const days = adminState.statsDays || 7;
  const r = await getJSON('/api/stats?days='+days).catch(() => null);
  if (!r || stale(gen)) return;
  const hours = sec => sec >= 3600 ? (sec / 3600).toFixed(1).replace('.0', '')+' ч' : Math.round(sec / 60)+' мин';
  const max = Math.max(1, ...r.days.map(d => d.seconds));
  const wd = ['вс','пн','вт','ср','чт','пт','сб'];
  const bars = r.days.map(d => {
    const dt = new Date(d.date+'T12:00:00');
    const label = days <= 7 ? wd[dt.getDay()] : String(dt.getDate());
    return '<div class="sbar" title="'+d.date+'"><em>'+(d.seconds >= 60 ? hours(d.seconds) : '')+'</em>'+
      '<i style="height:'+(d.seconds / max * 100).toFixed(1)+'%"></i><span>'+label+'</span></div>';
  }).join('');
  $('adbody').innerHTML =
    '<div class="acard"><div class="ainfo"><b>Посмотрено за '+(days === 7 ? 'неделю' : days+' дней')+': '+hours(r.total)+'</b>'+
      '<span>считается только воспроизведение: перемотка и паузы не в счёт; музыка — нет</span></div>'+
      [7, 30].map(n => '<button class="btn'+(n === days ? ' on' : '')+'" data-adstats="'+n+'">'+n+' дней</button>').join('')+'</div>'+
    '<div class="sbars">'+bars+'</div>'+
    '<h3>Чаще всего</h3>'+(r.top.length ? r.top.map((t, i) =>
      '<div class="arow"><div class="ainfo"><b>'+(i + 1)+'. '+(t.kind === 'series' ? '📺 ' : '🎬 ')+escapeHtml(t.title)+'</b></div>'+
      '<span class="asize">'+hours(t.seconds)+'</span></div>').join('') : '<div class="empty">Пока ничего не смотрели</div>');
}

$('adfile').addEventListener('change', () => {
  const f = $('adfile').files[0];
  $('adfile').value = '';
  if (f) applyImage(f);
});

$('admin').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.ad === 'back') return adminBack();
  if (d.ad === 'up') return adminBack();
  if (d.pin) return pinKey(d.pin);
  if (d.adtab) { adminState.tab = d.adtab; adminState.dir = null; adminState.picker = null; adminState.infoEdit = null;
    if (adminState.marks) { stopMarkVideo(); adminState.marks = null; }
    adStatus(''); return adminRender(); }
  const item = id => adminState.items[id] || {id, name: '', path: ''};
  if (d.adopen) {
    adminState.dir = {id: d.adopen, parent: adminState.dir};
    return adminRender();
  }
  if (d.adcover) return openPicker('cover', d.adcover);
  if (d.adinfo) { const it = adminState.items[d.adinfo] || {}; adminState.infoEdit = {id: d.adinfo, name: it.name || '', info: undefined}; return adminRender(); }
  if (d.adinfoedit) return editInfoField(d.adinfoedit);
  if (d.adinfofetch) {
    const ie = adminState.infoEdit;
    const body = {id: ie.id, fetch: true};
    if (d.adinfofetch === 'as') {
      const t = await askText('Искать под названием (можно с годом: «Legion 2017»)', (ie.info && ie.info.title) || ie.name, '');
      if (!t || !t.trim()) return;
      const m = /^(.*?)[\s(]*((?:19|20)\d{2})\)?\s*$/.exec(t.trim());
      body.title = m ? m[1].trim() : t.trim();
      if (m) body.year = +m[2];
    }
    adStatus('Ищу в IMDb, Wikidata, Википедии…');
    const r = await adminFetch('/api/admin/info', {method: 'POST', body});
    if (r) { ie.info = r.info; adStatus('Найдено и сохранено', 'ok'); adminRender(); }
    return;
  }
  if (d.adinfoclear) {
    if (!await askConfirm('Удалить описание? В следующий раз его поищут заново.', 'Очистить', true)) return;
    const r = await adminFetch('/api/admin/info', {method: 'POST', body: {id: adminState.infoEdit.id, clear: true}});
    if (r) { adminState.infoEdit.info = null; adStatus('Описание удалено', 'ok'); adminRender(); }
    return;
  }
  if (d.adstats) { adminState.statsDays = +d.adstats; return adminRender(); }
  if (d.admarks) return openAdminMarks(d.admarks);
  if (d.adscanfrom) { adminState.scanFromStart = adminState.scanFromStart === false; return adminRender(); }
  if (d.adscan) {
    const r = await adminFetch('/api/admin/marks/scan', {method: 'POST',
      body: {id: d.adscan, from_start: adminState.scanFromStart !== false}});
    if (!r) return;
    adminState.scan = r;
    adStatus('Слушаем серии — это займёт пару минут', 'ok');
    await adminRender();
    return pollScan();
  }
  if (d.adscanstop) {
    await adminFetch('/api/admin/marks/scan/stop', {method: 'POST'});
    return pollScan();
  }
  if (d.admkdir) { adminState.marks.season = {id: d.admkdir, name: d.name}; return adminRender(); }
  if (d.admkfile) return openMarkFile(d.admkfile, d.name);
  if (d.admkscope) { adminState.marks.scope = d.admkscope; return adminRender(); }
  if (d.admk) {
    const vid = $('advid');
    if (d.admk === 'play') { if (vid.paused) vid.play().catch(() => {}); else vid.pause(); return; }
    const step = parseFloat(d.admk);
    if (!isNaN(step)) {
      vid.currentTime = Math.max(0, Math.min((vid.duration || 1e9) - 0.5, (vid.currentTime || 0) + step));
      return updateMarkPos();
    }
    return saveMark(d.admk);
  }
  if (d.adinto) { const it = adminState.items[d.adinto] || build.target || {}; return uploadInto(d.adinto, it.name || 'папку'); }
  if (d.adbuild) {
    if (d.adbuild === 'new' || d.adbuild === 'inner') {
      const inner = d.adbuild === 'inner';
      const name = await askText(inner ? 'Название папки внутри «'+build.target.name+'»' : 'Название нового альбома', '', '');
      if (!name || !name.trim()) return;
      const body = inner ? {name, id: build.target.id} : {name, kind: 'music'};
      const r = await adminFetch('/api/admin/mkdir', {method: 'POST', body});
      if (r) { build.target = r; adminState.dirty = true; adStatus('Создано: '+r.name, 'ok'); adminRender(); }
      return;
    }
    if (d.adbuild === 'pick-target' || d.adbuild === 'pick-source') {
      build.pick = {for: d.adbuild === 'pick-target' ? 'target' : 'source', stack: []};
      return adminRender();
    }
    const ids = build.items.filter(x => !x.is_dir).map(x => x.id);
    return buildTransfer(ids, d.adbuild === 'move-all');
  }
  if (d.adpickdir || d.adpicked) {
    const id = d.adpickdir || d.adpicked;
    const item = {id, name: d.name, path: d.path || (adminState.items[id] || {}).path || ''};
    if (d.adpickdir) { build.pick.stack.push(item); return adminRender(); }
    if (build.pick.for === 'target') build.target = item;
    else { build.source = item; await loadBuildSource(id); }
    build.pick = null;
    return adminRender();
  }
  if (d.adsrcdir) {
    build.source = {id: d.adsrcdir, name: d.name, path: ''};
    await loadBuildSource(d.adsrcdir);
    return adminRender();
  }
  if (d.adhear) return hearTrack(+d.adhear);
  if (d.adcopy) return buildTransfer([d.adcopy], false);
  if (d.admove) return buildTransfer([d.admove], true);
  if (d.adzip) { adminState.zipKind = d.adzip; return $('adzip').click(); }
  if (d.adpick) return openPicker(d.adpick, null);
  if (d.adalbum) { adminState.picker.albums.push({id: d.adalbum, name: d.name}); return adminRender(); }
  if (d.adphoto) return applyImage({photo_id: d.adphoto});
  if (d.adupload) return $('adfile').click();
  if (d.adunset) {
    const pk = adminState.picker;
    const q = d.adunset === 'background' ? '?target=background' : '?target=cover&id='+encodeURIComponent(pk.id);
    const r = await adminFetch('/api/admin/image'+q, {method: 'DELETE'});
    if (r) {
      adminState.dirty = true;
      adStatus(d.adunset === 'background' ? 'Фон убран' : 'Обложка убрана', 'ok');
      if (d.adunset === 'background') loadLooks(); else adminState.picker = null;
      adminRender();
    }
    return;
  }
  if (d.adlook) {
    const [key, val] = d.adlook.split(':');
    const body = {}; body[key] = key === 'arrows' ? val : +val;
    const r = await adminFetch('/api/admin/settings', {method: 'POST', body});
    if (r) { loadLooks(); adminRender(); }
    return;
  }
  if (d.adrename) {
    const it = item(d.adrename);
    const isFile = !it.is_dir;
    // в окне — настоящее имя на диске, а не очищенное название плитки
    const disk = it.path ? it.path.split('/').pop() : it.name;
    const current = it.is_dir ? disk : disk.replace(/\.[^.]+$/, '');
    const name = await askText('Новое имя для «'+it.name+'»', current,
      isFile ? 'Расширение файла сохранится само.' : 'Имя папки — это и название на ТВ, и запрос для поиска постера («Название (год)»).');
    if (name === null || name.trim() === '' || name.trim() === current) return;
    const r = await adminFetch('/api/admin/rename', {method:'POST', body:{id: it.id, name}});
    if (r) { adminState.dirty = true; adStatus('Переименовано: '+r.name, 'ok'); adminRender(); }
    return;
  }
  if (d.addelete) {
    const it = item(d.addelete);
    const days = adminState.overview ? adminState.overview.trash_days : 3;
    const ok = await askConfirm('Удалить «'+it.name+'»?\n'+(it.path||'')+'\n\nУйдёт в корзину и сотрётся с диска через '+days+' '+
      plural(days,'день','дня','дней')+'. До этого можно вернуть.', '🗑 Удалить', true);
    if (!ok) return;
    const r = await adminFetch('/api/admin/delete', {method:'POST', body:{id: it.id}});
    if (r) { adminState.dirty = true; adStatus('В корзине: '+r.entry.title+' — сотрётся '+fmtDate(r.entry.purge_at), 'ok'); adminRender(); }
    return;
  }
  if (d.adposter) {
    const it = item(d.adposter);
    const ok = await askConfirm('Найти постер для «'+it.name+'» заново?\nКартинка рядом с ним будет удалена (и подложенная руками тоже), новая найдётся при следующем показе плитки.', 'Искать заново');
    if (!ok) return;
    const r = await adminFetch('/api/admin/poster/reset', {method:'POST', body:{id: it.id}});
    if (r) { adminState.dirty = true; adStatus('Постер будет найден заново', 'ok'); }
    return;
  }
  if (d.adrestore) {
    const r = await adminFetch('/api/admin/trash/'+d.adrestore+'/restore', {method:'POST'});
    if (r) { adminState.dirty = true; adStatus('Вернулось на место: '+r.entry.title, 'ok'); adminRender(); }
    return;
  }
  if (d.adpurge) {
    const ok = await askConfirm('Стереть с диска сразу? Вернуть будет нельзя.', '✖ Стереть', true);
    if (!ok) return;
    const r = await adminFetch('/api/admin/trash/'+d.adpurge+'/purge', {method:'POST'});
    if (r) { adStatus('Стёрто: '+r.entry.title+', освободилось '+fmtSize(r.entry.size), 'ok'); adminRender(); }
    return;
  }
  if (d.adsvc) {
    if (d.adsvc === 'forget-pin') {
      adminState.pin = ''; store.set('htv.adminPin', '');
      return showPin('PIN забыт на этом устройстве');
    }
    if (d.adsvc === 'progress-clear' &&
        !await askConfirm('Очистить «Продолжить просмотр» целиком?', 'Очистить', true)) return;
    const r = await adminFetch('/api/admin/service/'+d.adsvc, {method:'POST'});
    if (r) {
      if (d.adsvc === 'progress-clear') adminState.dirty = true;
      adStatus({'photos-clear':'Копии фото удалены', 'posters-retry':'Постеры поищутся снова при показе плиток',
        'progress-clear':'«Продолжить просмотр» очищен', 'notify-test':'Отправлено — проверьте Telegram'}[d.adsvc] || 'Готово', 'ok');
      if (d.adsvc !== 'notify-test') adminRender();
    }
  }
});

// --- приложение для Android TV ---
//
// Встроенный браузер приставки водит курсором, приложение (habits/tv-app)
// передаёт странице настоящие стрелки. Оно представляется «HabitsTV/» в
// User-Agent: тогда «Начать» не нужно (автовоспроизведение там разрешено), а
// кнопка «Назад» на пульте спрашивает у страницы, есть ли куда возвращаться.
const IN_APP = /HabitsTV\//.test(navigator.userAgent);

window.habitsBack = function(){
  if ($('gate').style.display !== 'none') return false;
  if (!$('qlist').hidden) { toggleQueue(false); return true; }
  if (closeCast()) return true;
  if (!$('amodal').hidden) { modalAnswer(false); return true; }
  if (!$('admin').hidden) { adminBack(); return true; }
  if (skipKind) { cancelSkip(); return true; }
  if (photoFull) { closePhotoFull(); return true; }
  if ($('app').classList.contains('theater')) { actions.full(); return true; }
  if (mode === 'files') { if (stack.length) { goUp(); return true; } return false; }
  if ($('app').classList.contains('player')) { leavePlayer(); return true; }
  if (vstack.length) { vstack.pop(); renderVisual(); return true; }
  return false;   // главная: приложение закроется
};

if (IN_APP) {
  $('appSettings').hidden = false;
  $('appSettings').onclick = () => { try { HabitsApp.openSettings(); } catch(e){} };
  $('start').click();
} else {
  const apkURL = BASE + '/app/habits-tv.apk';
  fetch(apkURL, {method: 'HEAD'}).then(r => {
    if (!r.ok) return;
    $('apk').href = apkURL;
    $('apk').hidden = false;
  }).catch(() => {});
}
