<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habits TV</title>
<style>
/* Экран приставки — 1920×1080 при dpr 2, то есть 960 CSS-пикселей: всё крупное.
   Смотрят с дивана, а не с полуметра. */
:root{--bg:#0d0f14;--panel:#171a21;--line:#272b34;--text:#e8eaed;--muted:#9aa0ac;--accent:#4c8dff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif;overflow:hidden}
button{font:inherit}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:50}
#gate h1{font-size:34px;margin:0}
#gate p{color:var(--muted);margin:0;max-width:34em;text-align:center}
.big{font-size:22px;padding:14px 28px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
/* Код читают с дивана и перепечатывают на телефоне — отсюда размер,
   моноширинный шрифт и разбивка пополам. */
#pair{margin-top:22px;text-align:center}
#pair .lbl{color:var(--muted);font-size:14px;margin-bottom:6px}
#code{font:700 44px/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:6px}
#corner{position:fixed;right:10px;bottom:8px;z-index:20;color:var(--muted);font-size:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;opacity:.75}

/* Кнопки — одним стилем везде: фокус заметен с дивана */
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);cursor:pointer;outline:0;flex:none}
.btn:focus,.btn.on:focus{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:focus{box-shadow:0 0 0 3px #fff}

/* --- каркас --- */
#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}
/* Шапка общая для обоих режимов: переключатель стоит там, где раньше было
   слово «Библиотеки», и доступен из любого экрана. */
#head{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);
  color:var(--muted);font-size:14px;flex:none}
#modes{display:flex;gap:4px;flex:none}
#path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* Код виден и после входа: подключить второй телефон можно во время просмотра,
   не перезагружая страницу. */
#codeline{margin-left:auto;flex:none;color:var(--accent);
  font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px}
/* Видео — не меньше 60% ширины. minmax(0,…) обязателен: без него колонка
   растягивается под самое длинное имя файла, и видео сжимается в полоску —
   у элементов сетки min-width по умолчанию auto, а не 0. */
#body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,40%) minmax(0,60%)}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#right{display:flex;flex-direction:column;min-height:0;min-width:0}
#visual{display:none;min-height:0;overflow-y:auto;padding:10px 14px 60px}

/* Визуальный режим: каталог во всю ширину, плеер появляется только когда
   выбрали, что смотреть — пустой чёрный прямоугольник на главной ни к чему. */
#app.visual #body{grid-template-columns:minmax(0,1fr)}
#app.visual #left,#app.visual #right{display:none}
#app.visual #visual{display:block}
#app.visual.player #visual{display:none}
#app.visual.player #right{display:flex}
#app.visual.player video{flex:1;min-height:0;aspect-ratio:auto;height:auto}

/* «Во весь экран» своими силами: Fullscreen API в вебвью приставки не
   работает, а команда приходит с телефона — то есть без жеста на самом
   телевизоре, когда браузер его и не разрешил бы. Обычный CSS делает то же
   самое и слушается пульта. */
#app.theater #head,#app.theater #left,#app.theater #now,#app.theater #bar,
#app.theater #music,#app.theater #jobs,#app.theater #visual{display:none!important}
#app.theater #right{display:flex!important}
#app.theater video{position:fixed;inset:0;width:100vw;height:100vh;aspect-ratio:auto;
  object-fit:contain;background:#000;z-index:30}
#app.theater #corner{z-index:31}

/* --- файловый режим --- */
#mbar{display:flex;gap:6px;margin-top:6px}
#list{flex:1;overflow-y:auto;padding:6px}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;outline:0}
.row:focus{background:var(--accent);color:#fff}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;color:var(--muted);flex:none}
.row:focus .tag{color:#dbe6ff}
.warn{color:#ffc857}
video{width:100%;background:#000;aspect-ratio:16/9}
#now{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
#now b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
#music,#jobs{padding:10px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
#jobs{flex:1;overflow-y:auto}
#app.visual.player #jobs{flex:none;max-height:20vh}
.job{margin:6px 0}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:3px}
.prog i{display:block;height:100%;background:var(--accent)}
.hint{color:var(--muted);font-size:13px;padding:8px 14px}

/* --- визуальный режим --- */
.sec{margin:6px 0 18px}
.sec-head{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.sec-head h2{font-size:20px;margin:0;margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
/* Постер — сама кнопка: OK на нём открывает фильм или сериал */
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--panel);
  border:2px solid transparent;cursor:pointer;outline:0;display:flex;align-items:center;justify-content:center}
.poster:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent);transform:scale(1.03)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .ph{font-size:42px;opacity:.6}
.poster .badge{position:absolute;right:6px;top:6px;background:#000c;color:#fff;font-size:12px;
  padding:2px 6px;border-radius:6px}
.poster.square{aspect-ratio:1/1;background:linear-gradient(135deg,#2a3350,#1b2030)}
.tname{font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical}
.tile .btn{font-size:13px;padding:5px 8px}
.tbtns{display:flex;gap:4px;flex-wrap:wrap}
.row .btn.mini{font-size:13px;padding:3px 9px;flex:none}
/* карточка «Инфо» */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:12px;background:#ffffff1a;border:1px solid var(--line)}
.ratings{display:flex;flex-wrap:wrap;gap:14px;font-size:15px}
.ratings b{color:#ffd166}
.idesc{line-height:1.5;max-height:34vh;overflow-y:auto;color:#d5d8de}
.iactors{color:var(--muted);font-size:14px}
/* полоска «сколько посмотрено» по низу постера */
.poster .bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:#000a}
.poster .bar i{display:block;height:100%;background:var(--accent)}
.tsub{font-size:12px;color:var(--muted);margin-top:-4px}
.empty{color:var(--muted);font-size:14px}
/* экран сериала или музыкальной папки */
.detail{display:flex;gap:18px;align-items:flex-start}
.detail .poster{width:180px;flex:none;cursor:default}
.detail .poster:focus{transform:none}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.dinfo h2{margin:0;font-size:26px}
.dinfo .sub{color:var(--muted)}
.actions,.seasons{display:flex;flex-wrap:wrap;gap:6px}
.eps{margin-top:6px}
#vmusic{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;align-items:center;
  padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);z-index:10}
/* прогресс трека — тонкой полоской по верхнему краю панели, видно всегда */
.mprog{position:absolute;left:0;top:0;height:3px;background:var(--accent);width:0;transition:width .25s linear}
#music .mline{position:relative;height:3px;background:var(--line);border-radius:2px;margin:6px 0 2px}
#music .mline i{display:block;height:100%;background:var(--accent);width:0;border-radius:2px;transition:width .25s linear}
#vmusic .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
#app.visual:not(.player) #vmusic.on{display:flex}
/* значок приложения для Android TV в правом краю шапки */
.apk{flex:none;display:flex;align-items:center;color:#3ddc84;padding:4px;border-radius:6px;outline:0}
.apk:focus{background:var(--accent);color:#fff}
.apk[hidden],#appSettings[hidden]{display:none}
/* обновить и админка — значками рядом со значком приложения */
.hicon{flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:4px;
  border-radius:6px;outline:0;background:none;border:0;cursor:pointer}
.hicon:focus,.hicon:hover{background:var(--accent);color:#fff}
.hicon.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* выбор музыки прямо в панели плеера */
#mpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#mpick[hidden]{display:none}
#mpick .lbl{width:100%;font-size:13px}

/* --- админка --- */
#admin{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
#admin[hidden]{display:none}
.ahead{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.ahead h2{margin:0 8px 0 0;font-size:20px}
.atabs{display:flex;gap:4px;margin-left:auto}
#adstatus{padding:6px 14px;font-size:14px;min-height:0;flex:none}
#adstatus:empty{display:none}
#adstatus.err{color:#ff8a80}
#adstatus.ok{color:#7ee2a8}
#adbody{flex:1;overflow-y:auto;padding:8px 14px 40px}
#adbody h3{font-size:17px;margin:16px 0 6px}
.arow{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid var(--line);margin:4px 0}
.ainfo{flex:1;min-width:0}
.ainfo b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apath{display:block;color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asize{color:var(--muted);font-size:13px;flex:none;text-align:right}
.arow .btn{font-size:13px;padding:5px 9px}
.acard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acard .ainfo span{color:var(--muted);font-size:13px}
.abar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px;max-width:320px}
.abar i{display:block;height:100%;background:var(--accent)}
.sbars{display:flex;align-items:flex-end;gap:6px;height:160px;margin:8px 0 4px;padding:0 4px;border-bottom:1px solid var(--line)}
.sbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.sbar i{display:block;width:100%;max-width:46px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.sbar span{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.sbar em{font-size:11px;font-style:normal;color:var(--muted);margin-bottom:2px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.agrid .pth{width:100%;height:auto;aspect-ratio:3/2}
.mkvid{display:block;width:100%;max-width:calc(42vh * 16 / 9);height:42vh;object-fit:contain;
  background:#000;border-radius:8px;margin:8px auto}
.mkrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.mkrow .lbl{width:100%;color:var(--muted);font-size:13px}
.mkpos{font:700 19px/1 ui-monospace,Menlo,Consolas,monospace;padding:0 6px}
.abg{width:240px;aspect-ratio:16/9;border-radius:8px;background:#000 center/cover no-repeat;border:1px solid var(--line);flex:none}
/* PIN: кнопки-цифры — пульт ходит по ним стрелками */
.pin{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:30px}
#pindots{font:700 34px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:12px;min-height:40px}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:8px}
.pinpad .btn{font-size:22px;padding:12px 0}
/* своё окно подтверждения и ввода: системные диалоги в WebView на ТВ
   блокируют страницу и не всегда управляются пультом */
#amodal{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:center;justify-content:center}
#amodal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(560px,92vw);
  display:flex;flex-direction:column;gap:12px}
.mbox p{margin:0;white-space:pre-line}
.mbox input{font:inherit;font-size:18px;padding:8px 10px;border-radius:8px;border:2px solid var(--line);
  background:var(--bg);color:var(--text);outline:0}
.mbox input:focus{border-color:var(--accent)}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
.btn.danger{border-color:#e5534b;color:#ff8a80}
.btn.danger:focus{background:#e5534b;color:#fff}
.poster.wide{aspect-ratio:16/9;background:linear-gradient(135deg,#2a3350,#1b2030)}
.poster.photo{aspect-ratio:3/2;background:linear-gradient(135deg,#2a3350,#1b2030)}

/* --- фото: папка --- */
/* Экран папки: снимок на большую часть экрана, под ним полоса превью и
   вложенные папки. Стрелки ходят по полосе, снимок сверху меняется на ходу. */
#visual.photos{overflow:hidden;padding:8px 10px}
#app.music-on #visual.photos{padding-bottom:64px}
.pv{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.pv-main{position:relative;flex:1;min-height:0;border-radius:10px;background:#000;outline:0;
  border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pv-main:focus{border-color:var(--accent)}
.pv-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pv-main .empty{padding:20px;text-align:center}
.pv-cap{position:absolute;left:8px;bottom:8px;background:#000b;color:#fff;font-size:13px;
  padding:3px 8px;border-radius:6px;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-strip{flex:none;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 6px;scrollbar-width:none}
.pv-strip::-webkit-scrollbar{display:none}
.pth{position:relative;flex:none;width:132px;height:88px;border-radius:8px;overflow:hidden;padding:0;
  border:2px solid transparent;background:var(--panel);cursor:pointer;outline:0}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth:focus,.pth.cur{border-color:var(--accent)}
.pth:focus{box-shadow:0 0 0 2px var(--accent)}
.pth.dir{background:linear-gradient(135deg,#2a3350,#1b2030)}
.pth.dir img{opacity:.55}
.pth .dn{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:#000c;color:#fff;font-size:12px;
  text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pth .dic{position:absolute;left:6px;top:4px;font-size:18px}
/* весь экран: только снимок, стрелки листают, «Назад» возвращает к полосе */
/* фон страницы (из админки) и размытый постер на экране сериала: слой под
   всем, картинка размывается и притемняется стилями — менять можно на ходу */
#bg{position:fixed;inset:-40px;z-index:0;background:#000 center/cover no-repeat;opacity:0;transition:opacity .5s}
#bg.on{opacity:1}
#bgdim{position:fixed;inset:0;z-index:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#app{position:relative;z-index:1}
/* пропустить заставку / следующая серия — поверх видео, и во весь экран тоже */
#skipbox{position:fixed;right:24px;bottom:70px;z-index:34;display:flex;gap:8px;align-items:center}
#skipbox[hidden]{display:none}
#skipbox .btn{font-size:18px;padding:10px 16px;box-shadow:0 4px 16px #000a}
#markpanel{padding:8px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
#markpanel[hidden]{display:none}
#markpanel .mrow{width:100%;color:var(--muted)}
#app.theater #markpanel{display:none}
/* играющий трек в списке — видно, где ты, не глядя на нижнюю панель */
.row.cur{border:1px solid var(--accent)}
.row.cur .nm{color:var(--accent)}
.row .eq{flex:none;color:var(--accent)}
/* очередь поверх всего: список с текущим треком и полоской прогресса */
#qlist{position:fixed;left:0;right:0;bottom:0;top:12vh;z-index:46;background:var(--panel);
  border-top:1px solid var(--line);display:flex;flex-direction:column}
#qlist[hidden]{display:none}
.qhead{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.qhead b{font-size:18px}
.qhead .sub{color:var(--muted);font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qbody{flex:1;overflow-y:auto;padding:6px}
.qrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:8px;
  border:1px solid transparent;background:none;color:var(--text);cursor:pointer;outline:0;font:inherit}
.qrow:focus{background:var(--accent);color:#fff}
.qrow.cur{border-color:var(--accent);color:var(--accent)}
.qrow.cur:focus{color:#fff}
.qrow .n{flex:none;color:var(--muted);min-width:2.2em}
.qrow:focus .n{color:#dbe6ff}
.qrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qfoot{flex:none;padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:14px}
.qfoot .bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.qfoot .bar i{display:block;height:100%;background:var(--accent);width:0}
/* «Отправить на ТВ»: фото или ролик с телефона поверх всего */
#cast{position:fixed;inset:0;z-index:48;background:#000;display:none}
#cast.on{display:block}
#cast img,#cast video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#cast .cap{position:absolute;left:12px;bottom:10px;color:#fff;font-size:14px;background:#0009;padding:4px 10px;border-radius:6px}
/* подсказка поверх видео во весь экран: куда перемотали, пауза или ход */
#osd{position:fixed;left:50%;top:6%;transform:translateX(-50%);z-index:32;background:#000b;color:#fff;
  font-size:20px;padding:6px 16px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .3s}
#osd.on{opacity:1}
/* режимы музыки: выбранный подсвечен так же, как режим плеера в шапке */
.btn.mmode{min-width:2.4em}
#pfull{position:fixed;inset:0;background:#000;z-index:40;display:none}
#pfull.on{display:block}
#pfull img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .7s}
#pfull video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
#pfull.vid video{display:block}
#pfull.vid img{display:none}
/* ролик в полосе и на большом снимке — значок ▶ поверх кадра */
.pth .vb,.pv-main .vb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000a;color:#fff;

<script>
const BASE = '{{BASE}}';
const $ = id => document.getElementById(id);
const v = $('v');
// Два элемента для музыки: при плавном переходе конец одного трека и начало
// следующего звучат вместе. a — тот, что играет сейчас; роли меняются.
const audios = [$('a'), $('a2')];
let a = audios[0];
// события музыки слушаем у обоих элементов, но реагируем только на текущий
function onAudio(type, fn){ audios.forEach(el => el.addEventListener(type, e => { if (e.target === a) fn(e); })); }

// Очереди раздельные: видео помнит своё место, даже когда играет музыка.
// Ровно ради этого два элемента, а не один — пауза не выгружает видео.
let queue = [], qi = -1;          // видеоочередь
let musicQueue = [], mi = -1;     // музыкальная очередь; mi — индекс в ней
// Порядок игры: morder — индексы очереди в том порядке, в каком их играть
// (прямой или перемешанный), mpos — где мы в нём.
let morder = [], mpos = -1;

let stack = [];                   // где мы в дереве папок (режим «Файлы»)
let items = [];
// Очередь просмотра с главной: фильмы и сериалы по порядку. Когда её
// смотрят, plan указывает на текущую запись.
let watchList = loadWatchList();
let plan = null;
// «Продолжить просмотр»: где остановились в сериалах и фильмах. Живёт на
// агенте (хранилище вебвью бывает очищено), здесь — последний загруженный список.
let progressList = [];
let resumeFor = null;   // {id, to}: перемотать эту серию, как только она загрузится
// «✕ Убрать» с главной, а файл всё ещё загружен в плеере на паузе: без этого
// следующее же сохранение (например, при закрытии страницы) вернуло бы запись
let forgotten = null;

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};
// Как играть музыку: once — очередь один раз, all — плейлист по кругу,
// one — один трек по кругу. И порядок: прямой или случайный. Помнятся на
// приставке между запусками.
// Плавный переход между треками: включён ли, общая громкость музыки и
// текущий переход (объявлены здесь: renderMusicModes() зовётся при загрузке).
const FADE = 4;
let musicFade = store.get('htv.mfade', true) !== false;
let musicVol = 1;
let fadeTo = null;          // {el, pos}: куда переходим
let musicRepeat = ['once','all','one'].includes(store.get('htv.mrepeat','once')) ? store.get('htv.mrepeat','once') : 'once';
let musicShuffle = !!store.get('htv.mshuffle', false);
// «Музыка на паузе»: видео на паузу — играет музыка, видео пошло — музыка
// стихает. Только на эту сессию страницы.
let musicOnPause = false;
try { musicOnPause = sessionStorage.getItem('htv.musicOnPause') === '1'; } catch(e) {}

function loadWatchList(){
  try { return JSON.parse(localStorage.getItem('htv.watch') || '[]'); } catch(e){ return []; }
}
function saveWatchList(){ store.set('htv.watch', watchList); }

const fmt = t => {
  if (!isFinite(t)) return '';
  t = Math.round(t);
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
};
const getJSON = url => fetch(BASE+url).then(r => r.json());

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

$('start').onclick = () => {
  // Разблокировка звука — это само нажатие: браузер запоминает, что
  // пользователь взаимодействовал со страницей, и дальше пускает play()
  // откуда угодно. Ничего проигрывать для этого НЕ НАДО — и нельзя:
  // play() у элемента без источника не отвергается и не выполняется, он
  // висит вечно, и обработчик с await на нём не доходит до конца.
  $('gate').style.display = 'none';
  $('app').classList.add('on');
  setMode(store.get('htv.mode', 'visual'));
  loadLooks();
  pollJobs();
};

// --- режимы ---

let mode = 'visual';

function setMode(next){
  mode = next === 'files' ? 'files' : 'visual';
  setTimeout(() => updateBackdrop(), 0);
  store.set('htv.mode', mode);
  $('app').classList.toggle('visual', mode === 'visual');
  $('app').classList.remove('player');
  document.querySelectorAll('#modes .btn').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  if (mode === 'visual') openCatalog();
  else openLibraries();
}
document.querySelectorAll('#modes .btn').forEach(b => { b.onclick = () => setMode(b.dataset.mode); });

function goBack(){
  if (photoFull) return closePhotoFull();
  if (mode === 'files') return goUp();
  if ($('app').classList.contains('player')) return leavePlayer();
  if (vstack.length) { vstack.pop(); return renderVisual(); }
}
$('up').onclick = goBack;

// --- режим «Файлы»: дерево ---

async function openLibraries(){
  const r = await getJSON('/api/libraries');
  stack = [];
  items = r.libraries.map(l => ({id:l.id, name:l.title, is_dir:true, kind:l.kind}));
  render('Библиотеки');
}

async function openDir(id, name){
  const r = await getJSON('/api/browse?id='+encodeURIComponent(id));
  if (r.error) { $('path').textContent = r.error; return; }
  stack.push({id, name});
  items = r.items;
  render(stack.map(s=>s.name).join(' / '));
}

function goUp(){
  if (!stack.length) return;
  stack.pop();
  const parent = stack.pop();
  if (!parent) openLibraries(); else openDir(parent.id, parent.name);
}

function verdictTag(it){
  if (it.is_dir) return '';   // папку и так видно по значку в названии
  if (!it.info) return '';
  if (it.ready) return '<span class="tag">перекодирован</span>';
  if (it.info.verdict === 'ok') return '<span class="tag">'+(it.info.height?it.info.height+'p':fmt(it.info.duration))+'</span>';
  const why = {remux:'нужен MP4', audio:'звук '+it.info.acodec, video:'видео '+it.info.vcodec};
  return '<span class="tag warn">⚠ '+(why[it.info.verdict]||it.info.verdict)+' — нажмите, чтобы перекодировать</span>';
}

function render(title){
  $('path').textContent = title;
  $('up').style.visibility = stack.length ? 'visible' : 'hidden';
  const list = $('list');
  list.innerHTML = '';
  items.forEach((it, idx) => {
    const el = document.createElement('div');
    el.className = 'row';
    el.tabIndex = 0;
    el.innerHTML = '<span class="nm">'+(it.is_dir?'📁 ':'')+escapeHtml(it.name)+'</span>'+verdictTag(it);
    el.onkeydown = e => rowKeys(e, idx);
    el.onclick = () => activate(idx);
    list.appendChild(el);
  });
  const first = list.firstElementChild;
  if (first) first.focus();
}

function rowKeys(e, idx){
  const rows = [...$('list').children];
  if (e.key === 'ArrowDown'){ e.preventDefault(); e.stopPropagation(); (rows[idx+1]||rows[0]).focus(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); e.stopPropagation(); (rows[idx-1]||rows[rows.length-1]).focus(); }
  else if (e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); activate(idx); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); e.stopPropagation(); $('bar').firstElementChild.focus(); }
}

function playable(it){ return it.ready || (it.info && it.info.verdict === 'ok'); }

// Есть ли в файле картинка. Файл без видеодорожки в <video> открывать нельзя:
// получится чёрный прямоугольник вместо музыки — ровно то, чего быть не должно.
function hasVideo(it){ return !!(it.info && it.info.vcodec); }

/**
 * Собрать очередь и включить.
 *
 * Очередь — вся папка, а не один файл: сериал смотрят подряд. Но только
 * ОДНОРОДНАЯ: если в папке вперемешку серии и треки, за серией не должен
 * начинаться трек. force === 'music' позволяет пустить фильм фоном как звук.
 */
function startFrom(list, it, force){
  const all = list.filter(x => !x.is_dir && x.url && playable(x));
  const asMusic = force === 'music' || !hasVideo(it);
  let queueItems;
  if (force === 'music') queueItems = all;              // фильм фоном как звук
  else if (asMusic) queueItems = all.filter(x => !hasVideo(x));
  else queueItems = all.filter(hasVideo);
  const idx = Math.max(0, queueItems.findIndex(x => x.id === it.id));
  if (!queueItems.length) return;
  if (asMusic){ setMusicQueue(queueItems, idx); playMusic(); }
  else { plan = null; queue = queueItems; qi = idx; playVideo(); }
}

function activate(idx){
  const it = items[idx];
  if (it.is_dir) { openDir(it.id, it.name); return; }
  if (!it.info) return;
  if (!playable(it)) { transcode(it); return; }
  startFrom(items, it, '');
}

// --- режим «Визуальный»: каталог ---
//
// Каталог собирает агент по структуре папок: сериал — папка с сезонами,
// фильм — файл или папка с одним файлом, музыка — папки, где лежат треки.
// Постеры он же находит в интернете и кладёт рядом с фильмом или сериалом.

let catalog = {films:[], series:[], music:[], clips:[], photos:[]};
let vstack = [];      // экраны поверх главной: сериал, музыкальная папка

async function openCatalog(){
  $('path').textContent = 'Загрузка…';
  try { [catalog] = await Promise.all([getJSON('/api/catalog'), loadProgress()]); }
  catch(e) { $('path').textContent = 'Каталог не загрузился: '+e.message; return; }
  vstack = [];
  renderVisual();
}

function renderVisual(){
  const top = vstack[vstack.length-1];
  updateBackdrop(top);
  $('up').style.visibility = vstack.length ? 'visible' : 'hidden';
  if (!top) return renderHome();
  // список серий и треков грузится при КАЖДОМ показе экрана, а не только при
  // первом открытии: иначе после возврата из плеера экран застревал на
  // «Загрузка…» (разбор файлов закэширован, повтор почти бесплатный)
  if (top.kind === 'series') { renderSeries(top); return loadSeason(); }
  if (top.kind === 'music' || top.kind === 'playlist') { renderMusicDir(top); return loadTracks(); }
  if (top.kind === 'info') return renderInfo(top);
  if (top.kind === 'clips') { renderClipsDir(top); return loadClips(); }
  if (top.kind === 'photos') return renderPhotos(top);
}

const TILE_ICON = {film:'🎬', series:'📺', music:'🎵', playlist:'🎶', clip:'🎞', clips:'🎞', photos:'🖼'};
const TILE_SHAPE = {music:' square', playlist:' square', clip:' wide', clips:' wide', photos:' photo'};

function tileHTML(t, extra){
  const icon = TILE_ICON[t.kind];
  const badge = t.kind === 'series' ? '<span class="badge">'+t.seasons.length+' сез.</span>'
    : ['music','playlist','clips','photos'].includes(t.kind) ? '<span class="badge">'+t.count+'</span>' : '';
  // постер грузится отдельным запросом: агент может в этот момент искать его
  // в интернете, и каталог не должен его ждать
  const img = t.poster ? '<img loading="lazy" alt="" src="'+escapeHtml(t.poster)+'" onerror="this.remove()">' : '';
  return '<div class="tile">'+
    '<div class="poster'+(TILE_SHAPE[t.kind]||'')+'" tabindex="0" data-open="'+t.kind+':'+t.id+'">'+
      '<span class="ph">'+icon+'</span>'+img+badge+'</div>'+
    '<div class="tname">'+escapeHtml(t.name)+'</div>'+(extra||'')+'</div>';
}

function renderHome(){
  $('path').textContent = 'Медиатека';
  const box = $('visual');
  box.classList.remove('photos');
  let html = '';
  if (progressList.length) {
    html += '<div class="sec"><div class="sec-head"><h2>Продолжить просмотр</h2></div><div class="grid">'+
      progressList.map(progressTile).join('')+'</div></div>';
  }
  if (watchList.length) {
    html += '<div class="sec"><div class="sec-head"><h2>Очередь</h2>'+
      '<button class="btn primary" data-act="watch">▶ Смотреть очередь</button>'+
      '<button class="btn" data-act="clearwatch">Очистить</button></div><div class="grid">'+
      watchList.map((t, i) => tileHTML(t, '<button class="btn" data-unwatch="'+i+'">✕ Убрать</button>')).join('')+
      '</div></div>';
  }
  const section = (title, list, withQueue) => {
    html += '<div class="sec"><div class="sec-head"><h2>'+title+'</h2></div>';
    if (!list.length) { html += '<div class="empty">Пока пусто</div></div>'; return; }
    html += '<div class="grid">'+list.map(t => tileHTML(t,
      withQueue ? '<div class="tbtns"><button class="btn" data-enqueue="'+t.kind+':'+t.id+'">＋ В очередь</button>'+
        '<button class="btn" data-info="'+t.kind+':'+t.id+'">ℹ Инфо</button></div>' : '')).join('')+'</div></div>';
  };
  section('Сериалы', catalog.series, true);
  section('Фильмы', catalog.films, true);
  // ролики и фото бывают не у всех — пустой раздел только мешал бы листать
  if ((catalog.clips||[]).length) section('Видеоролики', catalog.clips, false);
  if ((catalog.photos||[]).length) section('Фото и видео', catalog.photos, false);
  // свои плейлисты — первыми, за ними папки
  section('Музыка', (catalog.playlists || []).concat(catalog.music || []), false);
  box.innerHTML = html;
  box.scrollTop = 0;
  focusFirst(box);
}

function episodeLabel(e){
  if (e.kind === 'film') return '';
  const m = /S(\d{1,2})\s*E(\d{1,3})/i.exec(e.episode) || /(\d{1,2})x(\d{1,3})/.exec(e.episode);
  if (m) return 'S'+String(+m[1]).padStart(2,'0')+' · E'+String(+m[2]).padStart(2,'0');
  return e.season ? e.season+' · '+e.episode : e.episode;
}

function progressTile(e, i){
  const pct = e.duration > 0 ? Math.min(100, e.position / e.duration * 100) : 0;
  const left = e.duration > 0 ? Math.max(1, Math.round((e.duration - e.position) / 60)) : 0;
  // позиция 0 — предыдущую серию досмотрели, эта следующая
  const sub = e.position > 0 ? 'осталось '+left+' мин' : 'следующая серия';
  const label = episodeLabel(e);
  return '<div class="tile">'+
    '<div class="poster" tabindex="0" data-resume="'+i+'"><span class="ph">'+(e.kind==='film'?'🎬':'📺')+'</span>'+
      (e.poster ? '<img loading="lazy" alt="" src="'+escapeHtml(e.poster)+'" onerror="this.remove()">' : '')+
      (label ? '<span class="badge">'+escapeHtml(label)+'</span>' : '')+
      '<span class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></span></div>'+
    '<div class="tname">'+escapeHtml(e.title)+'</div>'+
    '<div class="tsub">'+sub+'</div>'+
    '<button class="btn" data-unresume="'+i+'">✕ Убрать</button></div>';
}

function findTile(ref){
  const [kind, id] = ref.split(':');
  const list = kind === 'film' ? catalog.films : kind === 'series' ? catalog.series
    : kind === 'clip' || kind === 'clips' ? (catalog.clips||[])
    : kind === 'photos' ? (catalog.photos||[]) : kind === 'playlist' ? (catalog.playlists||[]) : catalog.music;
  return list.find(t => t.id === id) || watchList.find(t => t.kind === kind && t.id === id);
}

$('visual').addEventListener('click', e => {
  const el = e.target.closest('[data-mdir],[data-mpart],[data-addpl],[data-plrm],[data-info],[data-open],[data-act],[data-enqueue],[data-unwatch],[data-season],[data-ep],[data-track],[data-resume],[data-unresume],[data-clip],[data-photo],[data-pdir],[data-pmain]');
  if (!el) return;
  const d = el.dataset;
  if (d.resume) return resumeEntry(progressList[+d.resume]);
  if (d.unresume) return forgetProgress(progressList[+d.unresume]);
  if (d.open) return openTile(findTile(d.open));
  if (d.enqueue) return enqueue(findTile(d.enqueue), el);
  if (d.unwatch) { watchList.splice(+d.unwatch, 1); saveWatchList(); return renderHome(); }
  if (d.season) return selectSeason(+d.season);
  if (d.ep) return playEpisode(+d.ep);
  if (d.track) return playTrack(+d.track);
  if (d.clip) return playClip(+d.clip);
  if (d.mpart) return playMusicPart(+d.mpart);
  if (d.mdir) return openMusicDir(+d.mdir);
  if (d.info) return openInfo(findTile(d.info));
  if (d.addpl) {
    const it = (vstack[vstack.length-1].tracks || []).find(x => x.id === d.addpl);
    return addToPlaylist([d.addpl], 'Трек «'+(it ? it.name.replace(/\.[^.]+$/, '') : '')+'»');
  }
  if (d.plrm) {
    const top = vstack[vstack.length-1];
    return fetch(BASE+'/api/playlists/'+top.tile.id+'/remove', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: d.plrm})}).then(r => r.json()).then(r => { top.tile.count = r.count; renderVisual(); }).catch(() => {});
  }
  if (d.photo) return openPhotoFull(+d.photo);
  if (d.pmain !== undefined) return openPhotoFull(vstack[vstack.length-1].index);
  if (d.pdir) return openPhotoDir(vstack[vstack.length-1].dirs[+d.pdir]);
  switch (d.act){
    case 'series-resume': return resumeEntry(progressList.find(p => p.key === vstack[vstack.length-1].tile.id));
    case 'watch': return watchQueue(0);
    case 'clearwatch': watchList = []; saveWatchList(); return renderHome();
    case 'series-start': plan = null; return playSeriesFrom(vstack[vstack.length-1].tile, 0, 0);
    case 'series-queue': return enqueue(vstack[vstack.length-1].tile, el);
    case 'music-all': return playAllTracks();
    case 'clips-all': return playClip(0);
    case 'folder-to-pl': { const t = vstack[vstack.length-1].tile; return addToPlaylist([t.id], 'Папка «'+t.name+'»'); }
    case 'pl-rename': return (async () => {
      const top = vstack[vstack.length-1];
      const name = await askText('Новое название плейлиста', top.tile.name, '');
      if (!name || !name.trim()) return;
      const r = await fetch(BASE+'/api/playlists/'+top.tile.id+'/rename', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name})}).then(r => r.json()).catch(() => ({}));
      if (r.name) { top.tile.name = r.name; renderVisual(); }
    })();
    case 'pl-delete': return (async () => {
      const top = vstack[vstack.length-1];
      if (!await askConfirm('Удалить плейлист «'+top.tile.name+'»? Сами треки останутся в своих папках.', '🗑 Удалить', true)) return;
      await fetch(BASE+'/api/playlists/'+top.tile.id, {method:'DELETE'}).catch(() => {});
      catalog.playlists = (catalog.playlists || []).filter(p => p.id !== top.tile.id);
      vstack.pop(); renderVisual();
    })();
    case 'info-resume': return resumeEntry(progressList.find(p => p.key === vstack[vstack.length-1].tile.id));
    case 'info-start': {
      const t = vstack[vstack.length-1].tile;
      plan = null;
      return t.kind === 'film' ? playFilm(t) : playSeriesFrom(t, 0, 0);
    }
    case 'info-episodes': { const t = vstack[vstack.length-1].tile; vstack.pop(); return openTile(t); }
    case 'info-queue': return enqueue(vstack[vstack.length-1].tile, el);
    case 'slideshow': return openSlideshowSetup();
  }
});

async function openTile(t){
  if (!t) return;
  // открыли плитку сами — это уже не просмотр очереди с главной
  if (t.kind === 'film') { plan = null; return playFilm(t); }
  if (t.kind === 'series') {
    const saved = progressList.find(p => p.key === t.id);
    const season = saved ? Math.max(0, t.seasons.findIndex(s => s.id === saved.season_id)) : 0;
    vstack.push({kind:'series', tile:t, season, episodes:[]});
    return renderVisual();
  }
  if (t.kind === 'music' || t.kind === 'playlist') { vstack.push({kind:t.kind, tile:t, tracks:[]}); return renderVisual(); }
  if (t.kind === 'clip') { plan = null; return playFilm(t); }
  if (t.kind === 'clips') { vstack.push({kind:'clips', tile:t, clips:[]}); return renderVisual(); }
  if (t.kind === 'photos') return openPhotoDir(t);
}

function enqueue(t, el){
  if (!t) return;
  if (watchList.some(x => x.kind === t.kind && x.id === t.id)) {
    if (el) el.textContent = '✓ Уже в очереди';
    return;
  }
  // храним только то, что нужно для плитки: ссылки на файлы получим заново,
  // когда дойдёт дело — страница на приставке живёт сутками
  watchList.push({kind:t.kind, id:t.id, name:t.name, poster:t.poster, file:t.file||'',
                  seasons:t.seasons||[], count:t.count});
  saveWatchList();
  if (el) el.textContent = '✓ В очереди';
  // если очередь уже смотрят — новое встанет в конец сразу
}

// --- экран сериала ---

function renderSeries(top){
  const t = top.tile;
  $('path').textContent = t.name;
  const box = $('visual');
  box.classList.remove('photos');
  box.innerHTML = '<div class="detail">'+
    '<div class="poster"><span class="ph">📺</span>'+(t.poster?'<img alt="" src="'+escapeHtml(t.poster)+'" onerror="this.remove()">':'')+'</div>'+
    '<div class="dinfo"><h2>'+escapeHtml(t.name)+'</h2>'+
    '<div class="sub">'+t.count+' '+plural(t.count,'серия','серии','серий')+' · '+t.seasons.length+' '+plural(t.seasons.length,'сезон','сезона','сезонов')+'</div>'+
    '<div class="actions">'+seriesResumeButton(t)+
    '<button class="btn'+(seriesResumeButton(t)?'':' primary')+'" data-act="series-start">▶ Смотреть с начала</button>'+
    '<button class="btn" data-act="series-queue">＋ В очередь</button></div>'+

function seriesResumeButton(t){
  const e = progressList.find(p => p.key === t.id);
  if (!e) return '';
  const tail = e.position > 0 ? ', осталось '+Math.max(1, Math.round((e.duration - e.position)/60))+' мин' : '';
  return '<button class="btn primary" data-act="series-resume">▶ Продолжить '+escapeHtml(episodeLabel(e))+tail+'</button>';
}

async function loadSeason(){
  const top = vstack[vstack.length-1];
  if (!top || top.kind !== 'series') return;
  const season = top.tile.seasons[top.season];
  const r = await getJSON('/api/browse?id='+encodeURIComponent(season.id)).catch(() => ({items:[]}));
  if (vstack[vstack.length-1] !== top) return;    // пока грузили, ушли с экрана
  top.episodes = (r.items||[]).filter(x => !x.is_dir);
  const eps = $('eps');
  if (!eps) return;
  eps.innerHTML = top.episodes.length ? top.episodes.map((it, i) =>
    '<div class="row" tabindex="0" data-ep="'+i+'"><span class="nm">'+escapeHtml(it.name.replace(/\.[^.]+$/, ''))+
    '</span>'+verdictTag(it)+'</div>').join('') : '<div class="empty">В сезоне нет серий</div>';
}

function selectSeason(i){
  const top = vstack[vstack.length-1];
  top.season = i;
  document.querySelectorAll('#visual .seasons .btn').forEach((b, j) => b.classList.toggle('on', j === i));
  loadSeason();
}

function playEpisode(i){
  const top = vstack[vstack.length-1];
  const it = top.episodes[i];
  if (!it) return;
  if (!playable(it)) return transcode(it);
  plan = null;
  startSeason(top.episodes, i);
}

// Сериал играет сезон за сезоном: очередь — текущий сезон, а дальше плеер
// сам спрашивает у агента следующий (см. onQueueEnd). Грузить все сезоны
// разом незачем — у «Теории большого взрыва» их двенадцать, и разбор каждой
// серии на слабом процессоре стоит времени.
function startSeason(list, index){
  const vids = list.filter(x => !x.is_dir && x.url && playable(x) && hasVideo(x));
  const it = list[index];
  const idx = Math.max(0, vids.findIndex(x => x.id === it.id));
  if (!vids.length) return;
  queue = vids; qi = idx;
  playVideo();
  showPlayer();
}

async function playSeriesFrom(t, seasonIndex, episodeIndex){
  const season = t.seasons[seasonIndex];
  if (!season) return false;
  const r = await getJSON('/api/browse?id='+encodeURIComponent(season.id)).catch(() => ({items:[]}));
  const vids = (r.items||[]).filter(x => !x.is_dir && x.url && playable(x) && hasVideo(x));
  if (!vids.length) return playSeriesFrom(t, seasonIndex+1, 0);   // пустой или непригодный сезон
  queue = vids; qi = Math.min(episodeIndex, vids.length-1);
  playVideo();
  showPlayer();
  return true;
}

async function playFilm(t){
  const r = await getJSON('/api/item?id='+encodeURIComponent(t.file)).catch(e => ({error:e.message}));
  if (!r.item) { $('path').textContent = r.error || 'Фильм не открылся'; return false; }
  if (!playable(r.item)) { transcode(r.item); return false; }
  queue = [r.item]; qi = 0;
  playVideo();
  showPlayer();
  return true;
}

// --- музыкальная папка ---

function renderMusicDir(top){
  const t = top.tile;
  const pl = top.kind === 'playlist';
  $('visual').classList.remove('photos');

  $('visual').innerHTML = '<div class="detail">'+
    '<div class="poster square"><span class="ph">'+(pl ? '🎶' : '🎵')+'</span>'+
      (t.poster ? '<img alt="" src="'+escapeHtml(t.poster)+'" onerror="this.remove()">' : '')+'</div>'+
    '<div class="dinfo"><h2>'+escapeHtml(t.name)+'</h2>'+
    '<div class="sub">'+t.count+' '+plural(t.count,'трек','трека','треков')+'</div>'+
    '<div class="actions"><button class="btn primary" data-act="music-all">▶ Играть всё</button>'+
      (pl ? '<button class="btn" data-act="pl-rename">✏ Переименовать</button><button class="btn danger" data-act="pl-delete">🗑 Удалить плейлист</button>'
          : '<button class="btn" data-act="folder-to-pl">＋ Всю папку в плейлист</button>')+'</div>'+

    ((t.seasons && t.seasons.length) ? '<div class="seasons">'+t.seasons.map((d, i) =>
      '<button class="btn" data-mpart="'+i+'">▶ '+escapeHtml(d.name)+' · '+d.count+'</button>').join('')+'</div>' : '')+
    '<div class="eps" id="tracks"><div class="empty">Загрузка…</div></div></div></div>';
  focusFirst($('visual'));
}

// Список папки: сначала подпапки строками (в них заходят), потом свои треки.
// Раньше треки подпапок сыпались сюда же вперемешку и было не понять, что
// откуда; «Играть всё» по-прежнему берёт альбом целиком, со всеми дисками.
async function loadTracks(){
  const top = vstack[vstack.length-1];
  const pl = top.kind === 'playlist';
  const r = await getJSON(pl ? '/api/playlists/'+encodeURIComponent(top.tile.id) : '/api/browse?id='+encodeURIComponent(top.tile.id)).catch(() => ({items:[]}));
  if (vstack[vstack.length-1] !== top) return;
  top.tracks = (r.items||[]).filter(x => !x.is_dir);
  top.subdirs = (r.items||[]).filter(x => x.is_dir);
  const dirs = top.subdirs.map((d, i) =>
    '<div class="row" tabindex="0" data-mdir="'+i+'"><span class="nm">📁 '+escapeHtml(d.name)+'</span></div>').join('');
  const tracks = top.tracks.map((it, i) =>
    '<div class="row" tabindex="0" data-track="'+i+'"><span class="nm">'+escapeHtml(it.name.replace(/\.[^.]+$/, ''))+
    '</span>'+verdictTag(it)+
    (pl ? '<button class="btn mini" data-plrm="'+it.id+'" title="Убрать из плейлиста">✕</button>'
        : '<button class="btn mini" data-addpl="'+it.id+'" title="В плейлист">＋</button>')+'</div>').join('');
  $('tracks').innerHTML = (dirs + tracks) ||
    '<div class="empty">'+(pl ? 'Плейлист пуст — добавляйте треки кнопкой «＋» в папках музыки' : 'Треков нет')+'</div>';
  markPlayingRow();
}

// Открыть подпапку: обычный экран музыки, как у альбома.
function openMusicDir(i){
  const top = vstack[vstack.length-1];
  const d = top && top.subdirs && top.subdirs[i];
  if (!d) return;
  vstack.push({kind:'music', tile:{id:d.id, name:d.name, kind:'music', count:0}, tracks:[]});
  renderVisual();
}

// Подсветка играющего трека в открытом списке: слышно музыку — видно, где она.
function markPlayingRow(){
  const box = $('tracks');
  if (!box) return;
  const top = vstack[vstack.length-1];
  const cur = musicQueue[mi];
  box.querySelectorAll('.row.cur').forEach(r => { r.classList.remove('cur'); const e = r.querySelector('.eq'); if (e) e.remove(); });
  if (!cur || !top || !top.tracks) return;
  const i = top.tracks.findIndex(x => x.id === cur.id);

// --- плейлисты ---

function tracksURL(id){ return /^pl[0-9a-f]+$/.test(id) ? '/api/playlists/'+encodeURIComponent(id) : '/api/tracks?id='+encodeURIComponent(id); }
async function tracksOf(id){
  const r = await getJSON(tracksURL(id)).catch(() => ({items: []}));
  return (r.items||[]).filter(x => !x.is_dir && x.url && playable(x) && !hasVideo(x));
}

// Куда добавить: список плейлистов и «новый». ids — треки или папка.
async function addToPlaylist(ids, what){
  const r = await getJSON('/api/playlists').catch(() => ({playlists: []}));
  const lists = r.playlists || [];
  let choice = null;
  const pick = e => { const b = e.target.closest('[data-plpick]'); if (b) choice = b.dataset.plpick; };
  $('mbox').addEventListener('click', pick);
  adminState.lastFocus = document.activeElement;
  const ok = await modal('<p>'+escapeHtml(what)+' — в какой плейлист?</p><div class="ssopt">'+
    lists.map(p => '<button class="btn" data-modal="ok" data-plpick="'+p.id+'">🎶 '+escapeHtml(p.name)+' · '+p.count+'</button>').join('')+
    '<button class="btn primary" data-modal="ok" data-plpick="new">＋ Новый плейлист…</button></div>'+
    '<div class="mbtns"><button class="btn" data-modal="cancel">Отмена</button></div>', '[data-plpick]');
  $('mbox').removeEventListener('click', pick);
  if (!ok || !choice) return;
  let res;
  if (choice === 'new') {
    const name = await askText('Название нового плейлиста', '', '');
    if (!name || !name.trim()) return;
    res = await fetch(BASE+'/api/playlists', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, ids})}).then(r => r.json()).catch(() => ({}));
    if (res.playlist) osd('🎶 «'+res.playlist.name+'»: '+res.playlist.count+' '+plural(res.playlist.count,'трек','трека','треков'));
  } else {
    res = await fetch(BASE+'/api/playlists/'+choice+'/add', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ids})}).then(r => r.json()).catch(() => ({}));
    if (res.count !== undefined) osd(res.added ? '🎶 Добавлено: '+res.added+', в плейлисте '+res.count : '🎶 Уже в плейлисте');
  }
  if (res && res.error) osd('⚠ '+res.error);
  catalog.playlists = (await getJSON('/api/playlists').catch(() => ({playlists: []}))).playlists || [];
}

// --- «Инфо»: карточка фильма или сериала ---
//
// Описание, год, жанры, оценки и актёры — агент берёт их из открытых
// источников при первом открытии и хранит рядом с постером; в админке их
// можно поправить. Отсюда же — смотреть с начала или продолжить.

async function openInfo(t){
  if (!t) return;
  vstack.push({kind: 'info', tile: t, info: undefined});
  renderVisual();
  const top = vstack[vstack.length-1];
  const r = await getJSON('/api/info?id='+encodeURIComponent(t.id)).catch(() => ({}));
  top.info = r.info || null;
  if (vstack[vstack.length-1] === top) renderInfo(top);
}

function playTrack(i){

// --- фото ---
//
// Экран папки: сверху снимок на большую часть экрана, снизу полоса — сами
// снимки, за ними вложенные папки. Стрелки ходят по полосе, и снимок сверху
// меняется вслед за фокусом, без OK. OK на снимке — во весь экран, там
// стрелки листают, «Назад» возвращает к полосе. Приставке агент отдаёт не
// оригиналы по 7 МБ, а копии под экран и маленькие превью.

let photoFull = false;
let photoTimer = null;

async function openPhotoDir(t){
  if (!t) return;
  const r = await getJSON('/api/photos?id='+encodeURIComponent(t.id)).catch(e => ({error:e.message}));
  if (r.error || !r.photos) { $('path').textContent = r.error || 'Папка не открылась'; return; }
  vstack.push({kind:'photos', tile:t, name:r.folder.name, photos:r.photos, dirs:r.dirs||[], index:0});
  renderVisual();
}

function renderPhotos(top){
  const box = $('visual');
  box.classList.add('photos');
  $('path').textContent = 'Альбом: '+vstack.filter(x => x.kind === 'photos').map(x => x.name).join(' / ');
  const n = top.photos.length;
  const stills = top.photos.filter(p => !p.video).length;
  const strip = (stills > 1 ? '<button class="pth ss" data-act="slideshow">▶ Слайд-шоу</button>' : '') +
    top.photos.map((p, i) =>
    '<button class="pth'+(i===top.index?' cur':'')+'" data-photo="'+i+'" title="'+escapeHtml(p.name)+'">'+
      '<img loading="lazy" alt="" src="'+escapeHtml(p.thumb)+'">'+(p.video ? '<span class="vb">▶</span>' : '')+'</button>').join('') +
    top.dirs.map((d, i) =>
    '<button class="pth dir" data-pdir="'+i+'">'+(d.cover?'<img loading="lazy" alt="" src="'+escapeHtml(d.cover)+'">':'')+
      '<span class="dic">📁</span><span class="dn">'+escapeHtml(d.name)+' · '+d.count+'</span></button>').join('');
  box.innerHTML = '<div class="pv">'+
    (n ? '<div class="pv-main" tabindex="0" data-pmain><img id="pvimg" alt=""><span class="vb" id="pvplay" hidden>▶</span><span class="pv-cap" id="pvcap"></span></div>'
       : '<div class="pv-main"><div class="empty">В этой папке ничего нет'+(top.dirs.length?' — выберите папку ниже':'')+'</div></div>')+
    '<div class="pv-strip" id="pvstrip">'+strip+'</div></div>';
  if (n) showPhoto(top.index, true);
  const cur = box.querySelector(n ? '.pth[data-photo="'+top.index+'"]' : '.pth');
  if (cur) { cur.focus({preventScroll:true}); cur.scrollIntoView({block:'nearest', inline:'center'}); }
}

// Снимок сверху: сразу превью (оно уже загружено полосой), следом — копия
// под экран. Пока листают стрелкой, крупную не просим: 150 мс тишины.
function showPhoto(i, now){
  const top = vstack[vstack.length-1];
  if (!top || top.kind !== 'photos' || !top.photos[i]) return;
  top.index = i;
  const p = top.photos[i];
  const img = $('pvimg');
  if (!img) return;
  document.querySelectorAll('#pvstrip .pth.cur').forEach(el => el.classList.remove('cur'));
  const th = document.querySelector('#pvstrip .pth[data-photo="'+i+'"]');
  if (th) th.classList.add('cur');
  $('pvcap').textContent = (i+1)+' / '+top.photos.length+' · '+p.name+(p.video ? ' · ролик, OK — смотреть' : '');
  $('pvplay').hidden = !p.video;
  clearTimeout(photoTimer);
  const big = () => loadInto(img, p.view, () => top.index === i);
  img.src = p.thumb;
  if (now) big(); else photoTimer = setTimeout(big, 150);
}

// Подменить картинку, только когда крупная загрузилась: иначе при быстром
// листании экран мигал бы пустотой.
function loadInto(img, url, still){
  const pre = new Image();
  pre.onload = () => { if (still()) img.src = url; };
  pre.src = url;
}

$('visual').addEventListener('focusin', e => {
  const th = e.target.closest && e.target.closest('.pth[data-photo]');
  if (th) showPhoto(+th.dataset.photo, false);
});

function openPhotoFull(i){
  const top = vstack[vstack.length-1];
  if (!top || top.kind !== 'photos' || !top.photos.length) return;
  photoFull = true;
  $('pfull').classList.add('on');
  fullPhoto(Math.max(0, Math.min(i, top.photos.length-1)));
}

// Два слоя картинки: новый снимок проявляется поверх старого, а не сменяет
// его рывком — для слайд-шоу это обязательно, для листания просто приятнее.
let pfFront = 'pfimg';
function fullImage(p, still){
  const front = $(pfFront), back = pfFront === 'pfimg' ? $('pfimg2') : $('pfimg');
  let shown = false;
  const show = src => {
    if (!still()) return;
    back.src = src;
    if (shown) return;
    shown = true;
    back.style.opacity = 1;
    front.style.opacity = 0;
    pfFront = back.id;
  };
  const big = new Image();
  big.onload = () => show(p.view);
  big.src = p.view;
  // копия под экран не успела — пусть пока проявится превью
  setTimeout(() => { if (!shown) show(p.thumb); }, 400);
}

function fullPhoto(i){
  const top = vstack[vstack.length-1];
  const n = top.photos.length;
  i = (i + n) % n;             // по кругу: с последнего на первый
  top.index = i;
  const p = top.photos[i];
  const vid = $('pfvid');
  if (p.video) {
    // ролик с телефона играет прямо здесь, OK — пауза
    $('pfull').classList.add('vid');
    vid.poster = p.view;
    vid.src = p.url;
    vid.play().catch(() => {});
  } else {
    $('pfull').classList.remove('vid');
    if (vid.getAttribute('src')) { vid.pause(); vid.removeAttribute('src'); vid.load(); }
    fullImage(p, () => photoFull && top.index === i);
  }
  $('pfcap').textContent = (i+1)+' / '+n+' · '+p.name+(slideshow ? (slideshow.paused ? ' · ⏸ слайд-шоу' : ' · ▶ слайд-шоу') : '');
  // соседние заранее: листают обычно подряд
  [i+1, i-1].forEach(j => { const q = top.photos[(j+n)%n]; if (q && !q.video) new Image().src = q.view; });
}

function closePhotoFull(){
  stopSlideshow();
  photoFull = false;
  $('pfull').classList.remove('on', 'vid');
  ['pfimg', 'pfimg2'].forEach(id => { $(id).removeAttribute('src'); $(id).style.opacity = 0; });
  const vid = $('pfvid');
  if (vid.getAttribute('src')) { vid.pause(); vid.removeAttribute('src'); vid.load(); }
  const top = vstack[vstack.length-1];
  if (top && top.kind === 'photos') renderPhotos(top);   // полоса встанет на последний снимок
}

$('pfull').addEventListener('click', e => {
  const b = e.target.closest('[data-pf]');
  const top = vstack[vstack.length-1];
  if (!b || !top) return;
  if (b.dataset.pf === 'close') return closePhotoFull();
  photoStep(b.dataset.pf === 'next' ? 1 : -1);
});

// --- слайд-шоу ---
//
// Снимки альбома по очереди (ролики пропускаются) с плавной сменой и музыкой из
// библиотеки: плейлистом по кругу или одной песней по кругу. Настройки
// запоминаются. OK — пауза, стрелки — листать руками, «Назад» — выйти (музыка
// встаёт, прежний режим повтора возвращается).

let slideshow = null;
const ssCfg = Object.assign({interval: 5, shuffle: false, music: {kind: 'none'}}, store.get('htv.slideshow', {}));

function photoStep(dir){
  const top = vstack[vstack.length-1];
  if (!top) return;
  if (!slideshow) return fullPhoto(top.index + dir);
  const ss = slideshow;
  ss.pos = (ss.pos + dir + ss.order.length) % ss.order.length;
  fullPhoto(ss.order[ss.pos]);
  scheduleSlide();
}

function scheduleSlide(){
  const ss = slideshow;
  if (!ss) return;
  clearTimeout(ss.timer);
  if (!ss.paused) ss.timer = setTimeout(() => photoStep(1), ss.cfg.interval * 1000);
}

function toggleSlideshowPause(){
  const ss = slideshow;
  if (!ss) return;
  ss.paused = !ss.paused;
  if (ss.paused) { clearTimeout(ss.timer); if (!a.paused) a.pause(); }
  else { scheduleSlide(); if (ss.music && a.paused) a.play().catch(() => {}); }
  osd(ss.paused ? '⏸ Слайд-шоу на паузе' : '▶ Слайд-шоу');
  fullPhoto(vstack[vstack.length-1].index);
}

async function startSlideshow(cfg){
  const top = vstack[vstack.length-1];
  if (!top || top.kind !== 'photos') return;
  let order = top.photos.map((p, i) => p.video ? -1 : i).filter(i => i >= 0);
  if (order.length < 2) return;
  if (cfg.shuffle) {
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  } else {
    // с того снимка, на котором стоим
    const k = order.indexOf(top.index);
    if (k > 0) order = order.slice(k).concat(order.slice(0, k));
  }
  slideshow = {cfg, order, pos: 0, timer: null, paused: false, music: false, repeat: musicRepeat};
  if (cfg.music.kind !== 'none') {
    let tracks = await tracksOf(cfg.music.folder);
    if (cfg.music.kind === 'song') tracks = tracks.filter(x => x.id === cfg.music.track);
    if (tracks.length && slideshow) {
      musicRepeat = cfg.music.kind === 'song' ? 'one' : 'all';
      setMusicQueue(tracks, cfg.music.kind === 'playlist' && musicShuffle ? Math.floor(Math.random() * tracks.length) : 0);
      playMusic();
      renderMusicModes();
      slideshow.music = true;
    }
  }
  if (!slideshow) return;
  openPhotoFull(order[0]);
  scheduleSlide();
  osd('▶ Слайд-шоу · OK — пауза, «Назад» — выход');
}

function stopSlideshow(){
  const ss = slideshow;
  if (!ss) return;
  slideshow = null;
  clearTimeout(ss.timer);
  if (ss.music) {
    if (!a.paused) a.pause();
    musicRepeat = ss.repeat;
    renderMusicModes();
  }
}

// Окно настройки перед запуском: интервал, музыка, порядок снимков.
let ssDraft = null;
async function openSlideshowSetup(){
  ssDraft = JSON.parse(JSON.stringify(ssCfg));
  await musicLibs();
  renderSlideshowSetup();
  adminState.lastFocus = document.activeElement;
  const ok = await modal($('mbox').innerHTML, '[data-ss="start"]');
  if (!ok) return;
  Object.assign(ssCfg, ssDraft);
  store.set('htv.slideshow', ssCfg);

function renderSlideshowSetup(tracksFor){
  const d = ssDraft;
  const on = c => c ? ' on' : '';
  let html;
  if (tracksFor) {
    html = '<p>Песня из «'+escapeHtml(tracksFor.name)+'» — будет играть по кругу:</p><div class="ssopt">'+
      tracksFor.tracks.map(t => '<button class="btn'+on(d.music.track === t.id)+'" data-ss="track" data-id="'+t.id+'" data-folder="'+tracksFor.id+'" data-name="'+escapeHtml(t.name.replace(/\.[^.]+$/, ''))+'">🎵 '+
        escapeHtml(t.name.replace(/\.[^.]+$/, ''))+'</button>').join('')+'</div>'+
      '<div class="mbtns"><button class="btn" data-ss="back">← Назад</button></div>';
  } else {
    const libs = (catalog.playlists || []).concat(catalog.music || []);
    html = '<p><b>Слайд-шоу</b></p>'+
      '<div class="ssopt"><span class="lbl">Каждый снимок</span>'+[3, 5, 8, 12].map(n =>
        '<button class="btn'+on(d.interval === n)+'" data-ss="interval" data-n="'+n+'">'+n+' с</button>').join('')+'</div>'+
      '<div class="ssopt"><span class="lbl">Музыка'+(d.music.kind === 'song' ? ': «'+escapeHtml(d.music.name||'')+'» по кругу' : '')+'</span>'+
        '<button class="btn'+on(d.music.kind === 'none')+'" data-ss="nomusic">Без музыки</button>'+
        libs.map(t => '<button class="btn'+on(d.music.kind === 'playlist' && d.music.folder === t.id)+'" data-ss="playlist" data-folder="'+t.id+'">🎵 '+escapeHtml(t.name)+' — плейлист</button>'+
          (t.seasons||[]).map(p => '<button class="btn'+on(d.music.kind === 'playlist' && d.music.folder === p.id)+'" data-ss="playlist" data-folder="'+p.id+'">↳ '+escapeHtml(p.name)+'</button>').join('')+
          '<button class="btn'+on(d.music.kind === 'song' && d.music.folder === t.id)+'" data-ss="songs" data-folder="'+t.id+'">🎵 Одна песня из «'+escapeHtml(t.name)+'»…</button>').join('')+
      '</div>'+
      '<div class="ssopt"><span class="lbl">Порядок снимков</span>'+
        '<button class="btn'+on(!d.shuffle)+'" data-ss="order" data-v="0">По порядку</button>'+
        '<button class="btn'+on(d.shuffle)+'" data-ss="order" data-v="1">🔀 Вперемешку</button></div>'+
      '<div class="mbtns"><button class="btn" data-modal="cancel">Отмена</button>'+
        '<button class="btn primary" data-modal="ok" data-ss="start">▶ Начать</button></div>';
  }
  $('mbox').innerHTML = html;
}

$('mbox').addEventListener('click', async e => {
  const b = e.target.closest('[data-ss]');
  if (!b || !ssDraft || b.dataset.ss === 'start') return;
  const d = ssDraft, k = b.dataset.ss;
  let focusSel = '[data-ss="'+k+'"]'+(b.dataset.n ? '[data-n="'+b.dataset.n+'"]' : '')+(b.dataset.folder ? '[data-folder="'+b.dataset.folder+'"]' : '')+(b.dataset.v ? '[data-v="'+b.dataset.v+'"]' : '');
  if (k === 'interval') d.interval = +b.dataset.n;
  if (k === 'nomusic') d.music = {kind: 'none'};
  if (k === 'playlist') d.music = {kind: 'playlist', folder: b.dataset.folder};
  if (k === 'order') d.shuffle = b.dataset.v === '1';
  if (k === 'songs') {
    const lib = (catalog.playlists || []).concat(catalog.music || []).find(t => t.id === b.dataset.folder);
    const tracks = await tracksOf(b.dataset.folder);
    renderSlideshowSetup({id: b.dataset.folder, name: lib ? lib.name : '', tracks});
    const first = $('mbox').querySelector('[data-ss="track"].on') || $('mbox').querySelector('[data-ss="track"]') || $('mbox').querySelector('[data-ss="back"]');
    if (first) first.focus();
    return;
  }
  if (k === 'track') { d.music = {kind: 'song', folder: b.dataset.folder, track: b.dataset.id, name: b.dataset.name}; focusSel = '[data-ss="songs"][data-folder="'+b.dataset.folder+'"]'; }
  if (k === 'back') focusSel = '[data-ss="songs"]';
  renderSlideshowSetup();
  const again = $('mbox').querySelector(focusSel) || $('mbox').querySelector('[data-ss="start"]');
  if (again) again.focus();
});

// Включить отдельный диск альбома: очередь — только его треки.
async function playMusicPart(i){
  const top = vstack[vstack.length-1];
  const part = top && top.tile.seasons && top.tile.seasons[i];
  if (!part) return;
  const tracks = await tracksOf(part.id);
  if (!tracks.length) return;
  setMusicQueue(tracks, musicShuffle ? Math.floor(Math.random() * tracks.length) : 0);
  playMusic();
}

function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

// --- продолжить просмотр ---

function loadProgress(){
  return getJSON('/api/progress').then(r => { progressList = r.items || []; }).catch(() => {});
}

async function forgetProgress(e){

  await fetch(BASE+'/api/progress/'+encodeURIComponent(e.key), {method:'DELETE'}).catch(()=>{});
  await loadProgress();
